<!DOCTYPE html>
<html lang="ja"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<title>D.E.R.B.Y. — HS競馬予想システム</title>
<style>
:root{
  --bg:#f2f2f7; --card:#fff; --card2:#f7f7f9; --fg:#000; --fg2:#3c3c43; --sub:#8a8a8e;
  --sep:rgba(60,60,67,.17); --accent:#1c4587; --accent2:#3b6fc4; --accent-l:#eaf0fa;
  --fill:#e9e9eb; --gold:#b8860b; --gold-l:#fff6e0; --green:#1a7f4b; --green-l:#e4f4ea;
  --red:#b3261e; --red-l:#fde8e4;
  --hdr:rgba(242,242,247,.82); --shadow:0 1px 2px rgba(0,0,0,.05),0 0 0 .5px rgba(0,0,0,.04);
}
[data-theme="dark"]{
  --bg:#000; --card:#1c1c1e; --card2:#2c2c2e; --fg:#fff; --fg2:#ebebf5; --sub:#8e8e93;
  --sep:rgba(84,84,88,.65); --accent:#5b8dd9; --accent2:#7aa6e4; --accent-l:#1b2a44;
  --fill:#2c2c2e; --gold:#e0b44c; --gold-l:#3a2f14; --green:#4cd07d; --green-l:#16351f;
  --red:#ff9d90; --red-l:#3a1712;
  --hdr:rgba(0,0,0,.72); --shadow:0 0 0 .5px rgba(255,255,255,.07);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--fg);
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Hiragino Sans",sans-serif;
  font-size:15px;line-height:1.45;letter-spacing:-.01em;
  padding-bottom:calc(40px + env(safe-area-inset-bottom,0px))}
.wrap{max-width:620px;margin:0 auto;padding:0 16px 40px}
header{position:sticky;top:0;z-index:30;background:var(--hdr);
  -webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);
  border-bottom:.5px solid var(--sep)}
.hrow{max-width:620px;margin:0 auto;padding:9px 16px;display:flex;align-items:center;gap:9px;min-height:48px}
.brand{display:flex;align-items:center;gap:9px;flex:1 1 auto;min-width:0}
.silks{display:inline-flex;height:17px;border-radius:3px;overflow:hidden;flex:0 0 auto;
  box-shadow:0 0 0 .5px var(--sep)}
.silks i{width:5px;height:100%;display:block}
.wm{font-size:15.5px;font-weight:800;letter-spacing:.1em;white-space:nowrap}
.vtag{flex:0 0 auto;font-size:10.5px;font-weight:700;color:var(--sub);letter-spacing:.02em;
  font-variant-numeric:tabular-nums;white-space:nowrap}
.back{flex:0 0 auto;display:flex;align-items:center;gap:3px;color:var(--accent2);font-size:16px;
  font-weight:600;letter-spacing:-.02em;background:none;border:0;padding:0;cursor:pointer}
.back svg{width:11px;height:18px;display:block}
.ttl{flex:1 1 auto;min-width:0;font-size:16px;font-weight:700;letter-spacing:-.02em;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lab{flex:0 0 auto;font-size:13px;font-weight:700;color:#fff;background:var(--accent);
  border-radius:99px;padding:5px 13px;text-decoration:none}
.tgl{flex:0 0 auto;width:32px;height:32px;border-radius:99px;border:0;background:var(--fill);
  color:var(--fg);font-size:15px;cursor:pointer}
h1.big{font-size:32px;font-weight:800;letter-spacing:-.04em;margin:18px 2px 2px;line-height:1.12}
.dayhead{display:flex;align-items:baseline;gap:9px;margin:18px 2px 14px;flex-wrap:wrap}
.dayhead .d1{font-size:21px;font-weight:800;letter-spacing:-.03em}
.dayhead .d2{font-size:13.5px;color:var(--sub);font-weight:600}
.date{font-size:14px;color:var(--sub);margin:0 2px 16px;font-weight:500}
.card{background:var(--card);border-radius:16px;margin:0 0 16px;box-shadow:var(--shadow);overflow:hidden}
.card .inner{padding:15px 16px}
.sec{font-size:14px;font-weight:700;letter-spacing:-.02em;margin:24px 4px 9px;display:flex;align-items:baseline;gap:8px}
.sec .cnt{font-weight:500;color:var(--sub);font-size:12.5px;letter-spacing:0}
.pk{position:relative;padding:14px 16px 14px 19px;cursor:pointer}
.pk+.pk::before{content:"";position:absolute;top:0;left:19px;right:0;height:.5px;background:var(--sep)}
.pk::after{content:"";position:absolute;left:0;top:12px;bottom:12px;width:3.5px;border-radius:0 3px 3px 0;background:var(--gold)}
.pk.miokuri::after{background:var(--sub);opacity:.45}
.pk.kau::after{background:var(--green)}
.pk:active{background:var(--card2)}
.pk .t{display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.pk .t b{font-size:16.5px;font-weight:700;letter-spacing:-.025em}
.pk .m{font-size:13px;color:var(--fg2);opacity:.78;margin-top:4px;line-height:1.55}
.tag{font-size:11px;font-weight:800;border-radius:6px;padding:2px 7px}
.t-kentou{background:var(--accent-l);color:var(--accent2)}
.t-kau{background:var(--green-l);color:var(--green)}
.t-miokuri{background:var(--fill);color:var(--sub)}
.marks{display:flex;gap:6px;flex-wrap:wrap;margin-top:9px}
.mark{display:flex;align-items:center;gap:6px;background:var(--card2);border-radius:9px;
  padding:4px 9px 4px 5px;font-size:12.5px;font-weight:600;border:.5px solid var(--sep)}
.mark .mj{color:var(--fg2);font-weight:600;font-size:11.5px;opacity:.85}
.mark .mx{color:var(--sub);font-weight:500;font-size:11.5px}
.cd{flex:0 0 auto;font-size:12.5px;font-weight:700;color:var(--accent2);font-variant-numeric:tabular-nums;
  background:var(--accent-l);border-radius:7px;padding:3px 8px;margin-left:auto}
.cd.soon{background:var(--red-l);color:var(--red)}
.cd.done{background:var(--fill);color:var(--sub)}
.row{display:flex;align-items:center;gap:11px;padding:14px 16px;position:relative;cursor:pointer}
.row+.row::before{content:"";position:absolute;top:0;left:16px;right:0;height:.5px;background:var(--sep)}
.row:active{background:var(--card2)}
/* 時刻の下にレース番号を置く＝見出しから場名が外れ、レース名に幅を回せる。
   上端に揃えるのは、見出しが折り返した時に縦中央だと段がずれて見えるため */
.time{flex:0 0 47px;align-self:flex-start;padding-top:1px}
.time b{display:block;font-size:15.5px;font-weight:800;font-variant-numeric:tabular-nums;
  letter-spacing:-.04em}
.time i{display:block;font-style:normal;font-size:11.5px;font-weight:700;color:var(--sub);
  margin-top:2px;white-space:nowrap;letter-spacing:-.02em}
.g{flex:1 1 auto;min-width:0}
/* 1行省略＝狭い端末で見出しも軸も折り返し、行の高さがバラバラになるのを防ぐ。
   ※中にボタンやリンクを入れないこと（V4.15.1でラボボタンを飲み込んだ事故がある） */
.g1{font-size:16px;font-weight:700;letter-spacing:-.025em;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.g2{font-size:12px;color:var(--sub);margin-top:3px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
/* 騎手＝全角スペースで区切ると7px無駄になるので、余白と濃さで分ける */
.g2 .jk{margin-left:5px;opacity:.78}
.pv{flex:0 0 auto;text-align:right;font-variant-numeric:tabular-nums}
.pv b{display:block;font-size:17px;font-weight:800;letter-spacing:-.04em;color:var(--accent2)}
.pv i{font-style:normal;font-size:11px;color:var(--sub)}
.chev{flex:0 0 auto;color:var(--sub);opacity:.5;font-size:17px;font-weight:700}
.sum{font-size:14px;color:var(--fg2);line-height:1.7}
.sum b{color:var(--fg);font-weight:700;font-variant-numeric:tabular-nums}
.stats{display:flex;gap:9px;margin-top:13px}
.stat{flex:1 1 0;background:var(--card2);border-radius:12px;padding:10px;text-align:center}
.stat .v{font-size:21px;font-weight:800;letter-spacing:-.05em;font-variant-numeric:tabular-nums;color:var(--accent2)}
.stat .k{font-size:11px;color:var(--sub);margin-top:2px}
.seg{display:flex;background:var(--fill);border-radius:11px;padding:2px;gap:2px}
.seg button{flex:1 1 0;border:0;background:transparent;border-radius:9px;padding:9px 4px;font:inherit;
  font-size:13.5px;font-weight:700;color:var(--fg2);letter-spacing:-.02em;cursor:pointer;opacity:.75}
.seg button.on{background:var(--card);color:var(--fg);opacity:1;box-shadow:0 1px 3px rgba(0,0,0,.14)}
[data-theme="dark"] .seg button.on{background:#48484a;box-shadow:none}
.lb{font-size:12.5px;color:var(--sub);font-weight:700;margin:16px 0 8px}
.lb:first-child{margin-top:0}
.res{margin-top:15px;background:linear-gradient(160deg,var(--accent),var(--accent2));border-radius:14px;
  padding:16px 17px;color:#fff}
.res .cap{font-size:12px;font-weight:700;opacity:.85}
.res .big{font-size:22px;font-weight:800;letter-spacing:-.04em;line-height:1.2;margin-top:2px}
.res .sm{font-size:12.5px;margin-top:9px;line-height:1.6;opacity:.92}
.hr{display:flex;align-items:center;gap:10px;padding:12px 16px;position:relative;cursor:pointer}
.hr+.hr::before{content:"";position:absolute;top:0;left:16px;right:0;height:.5px;background:var(--sep)}
.hr:active{background:var(--card2)}
.hr.picked{background:var(--gold-l)}
/* inline-flex＝馬番チップを馬名と同じ行に置く（blockだと改行して間延びする） */
.num{flex:0 0 auto;width:27px;height:27px;border-radius:8px;display:inline-flex;align-items:center;
  justify-content:center;font-weight:800;font-size:13px;font-variant-numeric:tabular-nums;
  border:1px solid transparent;vertical-align:-7px}
/* vertical-align は実測で合わせた（-5pxだとチップが約2px下がり、馬名が上寄りに見えた） */
.num.s{width:21px;height:21px;font-size:11.5px;border-radius:6px;vertical-align:-3px;margin-right:5px}
/* 馬名と詳細を縦に積む＝騎手を入れると1行では収まらないため（2026-09-13） */
.hg{flex:1 1 auto;min-width:0}
.hn{font-size:15.5px;font-weight:700;letter-spacing:-.025em;display:block;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hm{font-size:12.5px;color:var(--sub);display:block;margin-top:2px;overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap;font-variant-numeric:tabular-nums}
.hsb{flex:0 0 auto;font-size:11.5px;font-weight:800;color:var(--accent2);background:var(--accent-l);
  border-radius:6px;padding:3px 7px;font-variant-numeric:tabular-nums}
.pin{flex:0 0 auto;color:var(--gold);font-size:14px}
.bias{display:flex;gap:9px}
.bias div{flex:1 1 0;background:var(--card2);border-radius:12px;padding:11px 8px;text-align:center}
/* 「ミドルペース寄り」まで1行に収める（18pxでも16.5pxでも折り返した）。
   nowrap で段が割れるのを防ぎ、字送りを詰めて幅を作る。 */
.bias .v{font-size:15px;font-weight:800;letter-spacing:-.05em;font-variant-numeric:tabular-nums;
  white-space:nowrap;line-height:1.3}
.bias .k{font-size:11px;color:var(--sub);line-height:1.4;margin-top:3px}
/* ★.bias div の箱指定（背景・余白・角丸）を打ち消す。打ち消さないとゲージが潰れて見えない */
.bias .gauge{width:78px;margin:8px auto 2px;flex:none;height:15px;
  background:none;padding:0;border-radius:0}
.pickbtn{width:100%;margin-top:12px;padding:12px;border-radius:12px;border:0;font:inherit;font-size:15px;
  font-weight:800;cursor:pointer;background:var(--gold-l);color:var(--gold)}
.pickbtn.on{background:var(--gold);color:#fff}
details{background:var(--card);border-radius:16px;margin:0 0 10px;overflow:hidden;box-shadow:var(--shadow)}
summary{cursor:pointer;list-style:none;padding:15px 16px;font-size:15px;font-weight:700;
  display:flex;align-items:center;justify-content:space-between;gap:8px}
summary::-webkit-details-marker{display:none}
summary .c{font-weight:500;color:var(--sub);font-size:12.5px;margin-left:auto;margin-right:4px}
summary::after{content:"⌄";color:var(--sub);font-size:18px;font-weight:700;transform:translateY(-3px)}
details[open] summary::after{content:"⌃";transform:translateY(3px)}
.mini{font-size:12.5px;color:var(--sub);padding:0 16px 14px;line-height:1.6}
.mrow{display:flex;align-items:center;gap:9px;padding:10px 16px;position:relative;cursor:pointer}
.mrow+.mrow::before{content:"";position:absolute;top:0;left:16px;right:0;height:.5px;background:var(--sep)}
/* 材料の行も妙味・全レースと同じく、時刻の下にレース番号を置く */
.mrow .mt{flex:0 0 47px;align-self:flex-start;padding-top:1px}
.mrow .mt b{display:block;font-size:13.5px;font-weight:800;letter-spacing:-.03em;
  font-variant-numeric:tabular-nums}
.mrow .mt i{display:block;font-style:normal;font-size:11px;font-weight:700;color:var(--sub);
  margin-top:2px;white-space:nowrap;letter-spacing:-.02em}
.mrow .mg{flex:1 1 auto;min-width:0;font-size:13.5px;font-weight:600;line-height:1.4}
.mrow .sub2{display:block;font-size:11.5px;color:var(--sub);font-weight:500;margin-top:2px}
.mrow .mv{flex:0 0 auto;font-size:12.5px;font-weight:700;font-variant-numeric:tabular-nums}
.mv.down{color:var(--green)} .mv.up{color:var(--red)}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.4);display:none;align-items:flex-end;z-index:60;
  -webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px)}
.modal.on{display:flex}
.sheet{background:var(--card);width:100%;max-width:620px;margin:0 auto;border-radius:22px 22px 0 0;
  padding:10px 18px calc(26px + env(safe-area-inset-bottom,0px));max-height:88vh;overflow:auto;
  animation:up .26s cubic-bezier(.32,.72,0,1)}
@keyframes up{from{transform:translateY(24px)}to{transform:translateY(0)}}
.grab{width:36px;height:5px;border-radius:3px;background:var(--sep);margin:0 auto 14px}
.sheet h3{margin:0;font-size:24px;font-weight:800;letter-spacing:-.04em}
.sheet .sub{color:var(--sub);font-size:13.5px;margin:4px 0 15px;font-variant-numeric:tabular-nums}
.kv{display:grid;grid-template-columns:auto 1fr;font-size:14px;margin:0}
.kv dt{color:var(--sub);padding:10px 0;font-size:13px;border-bottom:.5px solid var(--sep)}
.kv dd{margin:0;padding:10px 0;text-align:right;font-variant-numeric:tabular-nums;font-weight:700;
  border-bottom:.5px solid var(--sep)}
.callout{font-size:12.5px;color:var(--fg2);background:var(--gold-l);border-radius:12px;padding:12px 13px;
  line-height:1.6;margin-top:15px}
.callout b{color:var(--gold)}
/* ★入力欄は必ず16px以上。iOS Safariは16px未満の input/textarea にフォーカスすると
   自動でズームし、そのまま戻らない（2026-09-13にメモ欄14.5pxで発生）。 */
.memo{width:100%;border:.5px solid var(--sep);border-radius:12px;padding:11px;font-size:16px;
  font-family:inherit;margin-top:14px;background:var(--card2);color:var(--fg);resize:none}
.btns{display:flex;gap:9px;margin-top:16px}
.btns button{flex:1 1 0;padding:14px;border-radius:13px;border:0;font:inherit;font-size:15.5px;
  font-weight:800;cursor:pointer;background:var(--fill);color:var(--fg)}
.btns button.fill{background:var(--accent);color:#fff}
.btns button:active{opacity:.7}
.err{background:var(--card);border-radius:16px;padding:16px;box-shadow:var(--shadow);font-size:14px;line-height:1.7}
.err b{color:var(--red)}
.setup input{width:100%;border:.5px solid var(--sep);border-radius:10px;padding:11px;font-size:16px;
  margin-top:8px;background:var(--card2);color:var(--fg);font-family:inherit}
.hide{display:none}
.load{color:var(--sub);font-size:14px;padding:24px 4px}
/* 展開＝数字でなく前後の傾きで読ませる。左が前・右が後 */
.tkrow{display:flex;align-items:center;gap:11px;padding:11px 16px;position:relative}
.tkrow+.tkrow::before{content:"";position:absolute;top:0;left:16px;right:0;height:.5px;background:var(--sep)}
.tkg{flex:1 1 auto;min-width:0}
.tkg b{font-size:13.5px;font-weight:700;letter-spacing:-.02em;display:block}
.tkg .s{font-size:11.5px;color:var(--sub);margin-top:2px;display:block}
.gauge{flex:0 0 84px;display:flex;gap:3px;height:18px;align-items:stretch}
/* ★輪郭を必ず出す。ダークでは --fill と --card2 が同じ #2c2c2e で、
   塗られていないセグメントが箱の背景に溶けて見えなくなる（2026-09-13 実機で発覚）。 */
.gauge i{flex:1 1 0;border-radius:3px;background:var(--fill);position:relative;
  box-shadow:inset 0 0 0 .5px var(--sep)}
.gauge i.on{background:var(--accent2)}
.gauge i.base::after{content:"";position:absolute;left:50%;top:50%;width:5px;height:5px;
  margin:-2.5px 0 0 -2.5px;border-radius:50%;background:var(--sub);opacity:.5}
.gauge i.on.base::after{background:#fff;opacity:.9}
.tklab{flex:0 0 40px;text-align:right;font-size:12.5px;font-weight:800;letter-spacing:-.02em}
/* ---- 買い目（V4のP2から移植・2026-09-13） ---- */
.seg.w{flex-wrap:wrap}
.seg.w button{flex:1 1 30%}
.khint{display:flex;align-items:flex-start;gap:8px;margin:0 0 12px;padding:9px 10px;
  background:var(--accent-l);border-radius:10px}
.khint .kk{flex:0 0 auto;font-size:11.5px;font-weight:800;color:#fff;background:var(--accent);
  border-radius:6px;padding:3px 8px;white-space:nowrap}
.khint .kw{font-size:11.5px;color:var(--fg2);line-height:1.5}
.tkrow{display:flex;align-items:center;gap:9px;margin-top:13px;padding-top:13px;
  border-top:.5px solid var(--sep)}
.tklb{font-size:13.5px;font-weight:700}
.tkn{font-size:11.5px;color:var(--sub);margin-left:auto}
.tkbtn{flex:0 0 auto;padding:6px 15px;border:.5px solid var(--sep);border-radius:9px;
  background:var(--card2);color:var(--fg);font:inherit;font-size:12.5px;font-weight:800;cursor:pointer}
.tkbtn.on{background:var(--accent);color:#fff;border-color:var(--accent)}
.tkbtn:disabled{opacity:.4}
.lbno{font-size:10.5px;color:var(--sub);font-weight:500;margin-left:6px}
.note{font-size:11.5px;color:var(--sub);line-height:1.6;margin:10px 0 0}
.sr{display:flex;align-items:center;gap:9px;padding:9px 16px;position:relative;cursor:pointer}
.sr+.sr::before{content:"";position:absolute;top:0;left:16px;right:0;height:.5px;background:var(--sep)}
.sr.dim{opacity:.42}
.selno{width:23px;height:23px;border-radius:99px;flex:0 0 auto;display:inline-flex;align-items:center;
  justify-content:center;font-size:11.5px;font-weight:800;background:var(--fill);color:var(--sub)}
.selno.on{background:var(--accent);color:#fff}
.selno.ax{background:var(--gold);color:#fff}
.selno.out{opacity:.45}
/* 丸は23pxしかないので、指で押せるよう周囲を含めて44px相当のヒット領域を作る。
   padding で広げ、同じ量の負マージンで見た目の位置は動かさない。 */
.selhit{flex:0 0 auto;display:inline-flex;align-items:center;justify-content:center;
  padding:11px 9px;margin:-11px -5px -11px -9px;cursor:pointer}
.selhit:active .selno{transform:scale(.88)}
.nm{flex:1 1 auto;min-width:0;font-weight:700;font-size:14px;overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap}
.mt2{flex:0 0 auto;font-size:11px;color:var(--sub);white-space:nowrap;font-variant-numeric:tabular-nums}
.up{color:var(--green);font-weight:800}
.dn{color:var(--red);font-weight:800}
.tkm{margin-left:5px;color:var(--accent2);font-size:10.5px;font-weight:700}
.sum2{display:flex;gap:11px;margin-top:14px;padding-top:14px;border-top:.5px solid var(--sep);flex-wrap:wrap}
.sum2>div{flex:1 1 0;min-width:60px}
.sum2 .k{font-size:10.5px;color:var(--sub);white-space:nowrap}
.sum2 .v{font-size:16.5px;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:-.03em;margin-top:1px}
.sum2 .v.warn{color:var(--red)}
.keep{width:100%;margin-top:13px;padding:13px;border-radius:12px;border:0;font:inherit;
  font-size:15.5px;font-weight:800;cursor:pointer;background:var(--accent);color:#fff}

async function fetchDoc(path){
  /* 1) 同じサイトに置かれたデータ（公開配信＝index.htmlと同階層）
     2) ローカル開発（07_viewer/ から見た ../）
     3) どちらも無ければ private リポジトリを各自のトークンで読む
     ★公開側にデータを置くと1で当たるので、トークンの分岐には入らない。 */
  for(const pre of ["","../"]){
    try{const r=await fetch(pre+path,{cache:"no-store"});if(r.ok)return await r.text();}catch(e){}
  }
  const repo=localStorage.getItem(LS.repo),token=localStorage.getItem(LS.token);
  if(!repo||!token)throw new Error("NOSETUP");
  const r=await fetch(`https://api.github.com/repos/${repo}/contents/${encodeURI(path)}`,
    {headers:{"Accept":"application/vnd.github.raw+json","Authorization":`Bearer ${token}`,
              "X-GitHub-Api-Version":"2022-11-28"},cache:"no-store"});
  if(r.status===401||r.status===403)throw new Error("トークンが無効か、このリポジトリへの権限がありません");
  /* privateリポジトリは「権限が無い」ときも存在を隠すため404を返す。
     「ファイルが無い」と言い切ると、他の人がトークンを入れて見た時に原因を誤解する */
  if(r.status===404)throw new Error("読めません（ファイルが無いか、このリポジトリへの権限がありません）: "+path);
  if(!r.ok)throw new Error("取得失敗 HTTP "+r.status);
  return await r.text();
}

/* 枠色（既存ビューアと同一） */
const WAKU=[null,["#ffffff","#333","#9aa1ab"],["#222222","#fff","#222"],["#e63946","#fff","#e63946"],
  ["#1d6fd6","#fff","#1d6fd6"],["#f6d32d","#333","#e3bd0e"],["#2e9e4f","#fff","#2e9e4f"],
  ["#f28c28","#fff","#f28c28"],["#f4a7c3","#333","#eb8fb2"]];
function waku(num,heads){
  num=+num;heads=+heads;
  if(!num||!heads)return 0;
  if(heads<=8)return num;
  const base=Math.floor(heads/8),rem=heads%8;let cum=0;
  for(let f=1;f<=8;f++){cum+=base+(f>8-rem?1:0);if(num<=cum)return f;}
  return 8;
}
function badge(num,heads,small){
  const [bg,fg,bd]=WAKU[waku(num,heads)]||["var(--fill)","var(--fg)","transparent"];
  return `<span class="num${small?" s":""}" style="background:${bg};color:${fg};border-color:${bd}">${esc(num)}</span>`;
}

function minsTo(hhmm){
  if(!hhmm)return null;
  const m=String(hhmm).match(/(\d{1,2}):(\d{2})/); if(!m)return null;
  const now=new Date(), t=new Date(now); t.setHours(+m[1],+m[2],0,0);
  return Math.round((t-now)/60000);
}
function cdHtml(hhmm){
  const d=minsTo(hhmm); if(d===null)return "";
  if(d<0)return `<span class="cd done">発走済み</span>`;
  if(d===0)return `<span class="cd soon">まもなく</span>`;
  if(d<60)return `<span class="cd ${d<=15?"soon":""}">あと${d}分</span>`;
  return `<span class="cd">あと${Math.floor(d/60)}時間${d%60?d%60+"分":""}</span>`;
}
const VCODE={"札幌":"01","函館":"02","福島":"03","新潟":"04","東京":"05","中山":"06","中京":"07","京都":"08","阪神":"09","小倉":"10"};
function labUrl(place,date){
  const m=String(place||"").match(/^(\D+)\s*(\d{1,2})/); if(!m)return "";
  const v=VCODE[m[1].trim()], d=String(date||"").replace(/-/g,"");
  if(!v||d.length!==8)return "";
  return `https://www.keibalab.jp/db/race/${d}${v}${String(m[2]).padStart(2,"0")}/`;
}
function timeOf(place){const r=(IDX&&IDX.races||[]).find(x=>x.place===place);return r?r.time:null;}

function tkband(v){
  if(v==null)return null;

}
function tenkaiLine(){
  const t=TODAY&&TODAY.tenkai; if(!t||!t.courses||!t.courses.length)return "まだ決着した鞍がありません。";
  const done=t.courses.filter(c=>c.fin>0); if(!done.length)return "まだ決着した鞍がありません。";
  const by={};
  done.forEach(c=>{const k=c.ba+c.surf;by[k]=by[k]||{f:0,n:0};by[k].f+=c.front;by[k].n+=c.fin;});
  return Object.keys(by).map(k=>`${k} 前残り <b>${Math.round(by[k].f/by[k].n*100)}%</b>（${by[k].n}鞍）`).join("　/　");
}

function who(x,extra){

  h.push(`<details><summary>大穴アラート<span class="c">${al.length}頭</span></summary>

  const cs=(TODAY.tenkai&&TODAY.tenkai.courses)||[];

      return `<div class="tkrow"><span class="tkg"><b>${esc(c.label)}</b>

    }).join("")}
    <div class="mini">左ほど前（逃げ・先行が残る）、右ほど後（差し・追込が決まる）。塗りが今日で、丸が平常の位置。

  const arace=(TODAY.allraces&&TODAY.allraces.length)?TODAY.allraces:null;

  $("homebody").innerHTML=h.join("");

function openRaceByPlace(place){

/* ---------- 買い目（V4のP2から移植・2026-09-13） ----------
   V5の「買い方」は説明文が出るだけのモックだったので、P2の実装をそのまま持ってきた。
   三連複オッズは 00_published/p2/sf_<raceId>.json（P1が取得した実値）を読む。 */
const TENKAI=[["none","読みなし"],["mae","前残り"],["sashi","差し・追込"],
              ["agari","上がり勝負"],["tanki","単騎逃げ"],["ran","乱ペース"]];
const RULE={none:{},mae:{"逃":3,"先":2,"差":-.5,"追":-2},sashi:{"逃":-2,"先":-1.5,"差":2,"追":2.5},
            agari:{},tanki:{"逃":4,"先":1},ran:{"逃":-2.5,"先":-1.5,"差":2,"追":2.5}};
const KATA={B5:{n:5,ax:0,l:"B5"},B6:{n:6,ax:0,l:"B6"},B7:{n:7,ax:0,l:"B7"},
            F5:{n:6,ax:1,l:"F5"},F6:{n:7,ax:1,l:"F6"},F7:{n:8,ax:1,l:"F7"},
            J2:{n:2,ax:2,l:"2頭軸×ヒモ全"}};
const KEN=[["sanrenpuku","3連複"],["umaren","馬連"],["tan","単勝"],["fuku","複勝"]];
let SF=null, UM=null;
let S={tenkai:"none",tekisei:false,ken:"sanrenpuku",kata:"F6",tanka:100,sel:[],log:[],
       tenkaiOpen:false,memoOpen:false};
try{S.log=JSON.parse(localStorage.getItem(LS.kaime)||"[]")}catch(e){}
try{const t=+localStorage.getItem(LS.tanka);if(t>=100)S.tanka=t}catch(e){}
const saveKaime=()=>{try{localStorage.setItem(LS.kaime,JSON.stringify(S.log));
  localStorage.setItem(LS.tanka,String(S.tanka))}catch(e){}};
const isTanpuku=()=>S.ken==="tan"||S.ken==="fuku";
const isUmaren=()=>S.ken==="umaren";
const oddsOf=(a,b,c)=>{ if(!SF)return null;
  const k=[a,b,c].map(Number).sort((x,y)=>x-y).join("-"); const v=SF.odds[k];
  return (v===undefined)?null:v; };
/* 馬連オッズ（★2026-09-13）。um_<raceId>.json ＝ C(頭数,2) の全組 */
const umOf=(a,b)=>{ if(!UM)return null;
  const k=[a,b].map(Number).sort((x,y)=>x-y).join("-"); const v=UM.odds[k];
  return (v===undefined)?null:v; };
/* 組の長さで券種を判別する＝呼び出し側が3連複か馬連かを気にしなくて済む */
const comboOdds=c=> (c && c.length===2) ? umOf(c[0],c[1]) : oddsOf(...c);

/* 穴×適性重視のシグナル。HS順位では相手網の外(8-10位)だが、脚質/騎手/距離帯複勝/前走で
   条件を満たす馬を拾う。★人気馬は外す(4番人気以下)＝穴を拾うのが狙いで堅い相手を増やす操作ではない。
   根拠＝全4841Rの飛び込みパターン（前脚質1.5/騎手A2.2/HS8-10位1.44倍）。 */
function tekiseiSig(h){
  const s=[];
  if(["逃","先"].includes(String(h.kyaku||"").slice(0,1))) s.push("前");
  const jk=String(h.jk||""); if(jk.includes("(A)")||jk.includes("(B)")) s.push("騎");
  const kf=parseFloat(String(h.kofuku||"").replace("%","")); if(kf>=45) s.push("距複");
  const z=String(h.zenso||""); if(["1","2","3"].includes(z.slice(0,1))) s.push("前走");
  return s;
}
function tekiseiHit(h){ return h.hsr>=8 && h.hsr<=10 && (h.pop==null||h.pop>=4) && tekiseiSig(h).length>0; }
function tekiseiCount(){ return (PACK?PACK.horses||[]:[]).filter(tekiseiHit).length; }

function auto(){
  const H=(PACK&&PACK.horses)||[];
  const ag=[...H].filter(h=>h.agari!=null).sort((a,b)=>a.agari-b.agari);
  const gr={}; ag.forEach((h,i)=>gr[h.num]=i+1);
  return [...H].map(h=>{let sc=-h.hsr;
      sc+=(RULE[S.tenkai][h.kyaku]||0);
      if(S.tenkai==="agari"&&gr[h.num]) sc+=((PACK.heads||H.length)-gr[h.num])*.35;
      if(S.tenkai==="ran"&&h.odds>=30) sc+=1.2;
      if(S.tekisei&&tekiseiHit(h)) sc+=3.2+0.4*tekiseiSig(h).length;
      return {...h,sc,moved:Math.abs(sc+h.hsr)>.01?(sc+h.hsr>0?1:-1):0};
    }).sort((a,b)=>b.sc-a.sc);
}
/* 券種の推奨。8,534鞍の実測で F6 と 軸の単勝 を同額(1,500円)で比べた相対比較。
   ★どの条件も1鞍あたりの損益は負＝「勝てる券種」ではなく「同じ鞍でどちらがマシか」。 */
function kenshuHint(){
  if(!PACK||!PACK.horses||!PACK.horses.length) return null;
  const hs=[...PACK.horses].sort((a,b)=>a.hsr-b.hsr);
  const ax=hs[0]; if(!ax) return null;
  const gap=(hs.length>1&&ax.hs!=null&&hs[1].hs!=null)?(ax.hs-hs[1].hs):null;
  const pop=ax.pop, heads=PACK.heads||hs.length;
  const mid=SF?midOddsF6():null;   /* ★選択中の券種に依存させない（midOddsF6 の注記を参照） */
  if(pop==null||gap==null) return null;
  if(pop<=3&&gap>=6)
    return {k:"単勝",why:`軸${pop}番人気・gap${gap.toFixed(1)}＝軸が来ると読める帯。実測では同額なら単勝が有利（F6は取り分が薄まる）`};
  if(pop>=4&&pop<=6&&(gap>=4||(mid!=null&&mid>30&&heads>=10)))
    return {k:"F6",why:`妙味帯(軸${pop}番人気)で`+(gap>=4?`gap${gap.toFixed(1)}`:`配当中央${Math.round(mid)}倍・${heads}頭`)
      +`＝軸の単勝的中率が1割を切る帯。相手へ散らす方が拾える`};
  if(pop>=4&&pop<=6)
    return {k:"単勝",why:"妙味帯だがgapが小さく配当も薄い。実測では単勝がわずかに有利"};
  return null;
}
function midOdds(){
  const {out}=combos(); if(!out||!out.length) return null;
  const os=out.map(c=>oddsOf(...c)).filter(v=>v!=null).sort((a,b)=>a-b);
  return os.length?os[Math.floor(os.length/2)]:null;
}
/* ★券種の推奨に使う配当中央は、いま選んでいる券種に依存させてはいけない（2026-09-13 修正）。
   midOdds() は combos() 経由で S.ken を見るため、単勝に切り替えると 1点＝3連複のキーが
   引けず mid=null になり、「配当中央30倍超」の条件が落ちて推奨が単勝へ反転していた。
   ＝利用者が選んだ券種を、そのまま推奨として返す自己参照になっていた。
   ここでは常に F6（軸1頭＋相手6頭）で組んだ場合の中央値を返す。 */
function midOddsF6(){
  const ord=auto(); if(ord.length<7) return null;
  const use=ord.slice(0,7).map(h=>h.num), a=use[0], r=use.slice(1), out=[];
  for(let i=0;i<r.length;i++) for(let j=i+1;j<r.length;j++) out.push([a,r[i],r[j]]);
  const os=out.map(c=>oddsOf(...c)).filter(v=>v!=null).sort((x,y)=>x-y);
  return os.length?os[Math.floor(os.length/2)]:null;
}
/* 馬連は「軸1頭＋相手」の軸流し＝最低2頭。相手は何頭でも足せる（点数＝相手の数） */
const need=()=>{ if(isTanpuku())return 1; if(isUmaren())return 2;
  const K=KATA[S.kata]; return K.ax===2?2:K.n; };
function resetSel(){ S.sel=auto().slice(0,need()).map(h=>h.num); if(PACK)drawRace(true); }
function topupSel(){ for(const h of auto()){ if(S.sel.length>=need())break;
  if(!S.sel.includes(h.num)) S.sel.push(h.num); } }
function combos(){
  const K=KATA[S.kata], use=S.sel.slice(0,need()), out=[];
  if(S.sel.length<need()) return {out:[],K,short:need()-S.sel.length};
  if(isTanpuku()) return {out:[[use[0]]],K,short:0};
  /* 馬連＝1番目を軸に、2番目以降の全部へ流す（need で切らない） */
  if(isUmaren()) return {out:S.sel.slice(1).map(n=>[S.sel[0],n]),K,short:0};
  if(K.ax===0){ for(let i=0;i<use.length;i++)for(let j=i+1;j<use.length;j++)for(let k=j+1;k<use.length;k++)
                  out.push([use[i],use[j],use[k]]); }
  else if(K.ax===1){ const a=use[0],r=use.slice(1);
    for(let i=0;i<r.length;i++)for(let j=i+1;j<r.length;j++) out.push([a,r[i],r[j]]); }
  else { const [a,b]=use; (PACK.horses||[]).forEach(h=>{if(h.num!==a&&h.num!==b) out.push([a,b,h.num]);}); }
  return {out,K,short:0};
}
function setT(k){ S.tenkai=k; S.sel=auto().slice(0,need()).map(h=>h.num); drawRace(true); }
function setKen(k){ S.ken=k; S.sel=auto().slice(0,need()).map(h=>h.num); drawRace(true); }
/* ★穴×適性重視ONではF型(軸1頭固定)を使わせない。適性重視は「軸が飛ぶ前提で網を広く張る」
   考え方で、軸1頭に依存するF型と設計が矛盾する（2026-09-05の該当26鞍＝F6 ON 49.9% / B7 ON 101.3%）。 */
function setTeki(){
  S.tekisei=!S.tekisei;
  if(S.tekisei&&["F5","F6","F7"].includes(S.kata)) S.kata="B7";
  S.sel=auto().slice(0,need()).map(h=>h.num); drawRace(true);
}
function setKata(k){
  if(S.tekisei&&["F5","F6","F7"].includes(k)) return;
  S.kata=k; topupSel(); drawRace(true);
}
function tapSel(n){ const i=S.sel.indexOf(n); if(i>=0)S.sel.splice(i,1); else S.sel.push(n); drawRace(true); }
function keepKaime(){
  const {out,K}=combos(); if(!out.length)return;
  const n=out.length, unit=Math.max(100,S.tanka||100);
  const kl=KEN.find(k=>k[0]===S.ken)[1];
  const body=isTanpuku()?`${S.sel[0]}番 ${unit.toLocaleString()}円`
            :isUmaren()?`${S.sel[0]}-${S.sel.slice(1).join(",")} ${n}点×${unit}円`
                        :`${K.l} ${S.sel.slice(0,need()).join("-")} ${n}点×${unit}円`;
  S.log.push(`${PACK.venue}${PACK.r}R ${kl} ${body} `
    +`展開=${TENKAI.find(t=>t[0]===S.tenkai)[1]}${S.tekisei?";穴x適性重視=ON":""}`);
  saveKaime(); drawRace();
}
function dropKaime(i){ S.log.splice(i,1); saveKaime(); drawRace(); }
function copyKaime(){
  const t=`${PACK.date} 買った記録\n`+S.log.map(x=>"- "+x).join("\n");
  navigator.clipboard?.writeText(t).then(()=>alert("コピーしました\n\n"+t),()=>alert(t));
}
function kaimeSummary(cb){
  const {out,short}=cb;
  if(short) return `<div class="sum2"><div><div class="k">あと${short}頭</div>
    <div class="v warn">選んでください</div></div></div>`;
  const unit=Math.max(100,S.tanka||100);
  if(isTanpuku()){
    const hh=(PACK.horses||[]).find(x=>+x.num===+S.sel[0]);
    const kl=KEN.find(k=>k[0]===S.ken)[1];
    return `<div class="sum2">
      <div><div class="k">券種</div><div class="v">${esc(kl)}</div></div>
      <div><div class="k">馬</div><div class="v">${esc(String(S.sel[0]||"-"))}番</div></div>
      <div><div class="k">投資</div><div class="v">${unit.toLocaleString()}</div></div>
      ${hh&&hh.odds?`<div><div class="k">単勝</div><div class="v">${esc(String(hh.odds))}</div></div>`:""}
      </div><button class="keep" onclick="keepKaime()">買った</button>`;
  }
  const n=out.length;
  const os=out.map(comboOdds).filter(v=>v!=null).sort((a,b)=>a-b);
  const unknown=n-os.length, mid=os.length?os[Math.floor(os.length/2)]:null;
  const safe=os.filter(o=>o>=n).length;
  return `<div class="sum2">
    <div><div class="k">点数</div><div class="v">${n}</div></div>
    <div><div class="k">投資</div><div class="v">${(unit*n).toLocaleString()}</div></div>
    <div><div class="k">配当・中央</div><div class="v">${mid==null?"—":mid.toFixed(0)}</div></div>
    <div><div class="k">トリガミ回避</div><div class="v ${os.length&&safe/os.length<.5?"warn":""}">${safe}/${os.length}</div></div>
    ${unknown?`<div><div class="k">配当不明</div><div class="v warn">${unknown}</div></div>`:""}
    </div><button class="keep" onclick="keepKaime()">買った</button>`;
}

  catch(e){ $("racebody").innerHTML=`<div class="err"><b>読み込めません</b><br>${esc(e.message)}</div>`; return; }

  try{ UM=JSON.parse(await fetchDoc(`00_published/p2/um_${rid}.json`)); }catch(e){ UM=null; }
  fillPickJk();
  S.sel=auto().slice(0,need()).map(h=>h.num);   /* 鞍が変わったら選択を組み直す */
  drawRace();
}
function pickOf(){ return PACK?PICKS.find(p=>p.race_id===PACK.race_id):null; }
/* 騎手を持たない古いピックを、その鞍を開いた時に埋める。
   ピックは付けた時点の情報を保存する作りなので、騎手を保存するようにする前に
   付けたものは jk を持たない。ホーム側は馬ごとの騎手を持っていないのでここで補う。 */
function fillPickJk(){
  const p=pickOf(); if(!p||!(p.marks||[]).length||!PACK) return;
  let changed=false;
  p.marks.forEach(m=>{
    if(m.jk) return;
    const h=(PACK.horses||[]).find(x=>+x.num===+m.num);
    if(h&&h.jk){ m.jk=h.jk; changed=true; }
  });
  if(changed) savePicks();
}

  let p=pickOf();
  if(!p){p={race_id:PACK.race_id,title:`${PACK.venue}${PACK.r}R ${PACK.race_name}`,

      `<tr><td>${esc(r)}</td><td><button class="del" onclick="dropKaime(${i})">消す</button></td></tr>`).join("")}</table>
      <button class="copyall" onclick="copyKaime()">まとめてコピー</button>
      <div class="note">鞍をまたいで貯まります。振り返りへの取り込みはMac側で行います。</div></div></div>`);
  }
  $("racebody").innerHTML=h.join("");
  /* 差し替え直後はレイアウトが未確定で scrollTo が中途半端に効く。次のフレームまで待つ */
  if(keep) requestAnimationFrame(()=>window.scrollTo(0,_y));
}
function togglePick(){
  const p=pickOf();
  if(p&&!(p.marks||[]).length&&!p.memo){ PICKS.splice(PICKS.indexOf(p),1); }
  else if(p){ if(!confirm("注目馬とメモも消えます。ピックを外しますか？"))return; PICKS.splice(PICKS.indexOf(p),1); }
  else ensurePick("検討中");
  savePicks(); drawRace(); drawHome();
}
function setState(s){
  const p=ensurePick(s);
  p.state=s; p.memo=($("rmemo")&&$("rmemo").value||"").trim(); p.heads=PACK.heads;
  /* ★drawRace(true)＝保存のたびに先頭へ飛ぶと「押しても何も起きない」ように見える */
  savePicks(); drawRace(true); drawHome();
}
function openM(num){
  const h=(PACK.horses||[]).find(x=>+x.num===+num); if(!h)return;
  const p=pickOf(), mk=(p&&p.marks||[]).find(m=>+m.num===+num);
  $("sheet").innerHTML=`<div class="grab"></div>
    <h3>${esc(h.name)}</h3>
    <div class="sub">${esc(h.num)}番・${esc(h.pop)}番人気 ${esc(h.odds)}倍／HS${esc(h.hsr)}位 ${esc(h.hs)}／${esc(h.jk)}・${esc(h.tr)}</div>
    <dl class="kv">
      <dt>脚質</dt><dd>${esc(h.kyaku)}</dd>
      <dt>調教</dt><dd>${esc(h.oikiri||"-")}</dd>
      <dt>上がり</dt><dd>${esc(h.agari_cell||"-")}</dd>
      <dt>コース複勝</dt><dd>${esc(h.kofuku||"-")}</dd>
      <dt>距離帯複勝</dt><dd>${esc(h.kyofuku||"-")}</dd>
      <dt>持ち時計</dt><dd>${esc(h.jitai||"-")}</dd>
      <dt>前走</dt><dd>${esc(h.zenso||"-")}</dd>
      <dt>斤量・馬体重</dt><dd>${esc(h.kin)}／${esc(h.bataiju||"-")}</dd>
      <dt>オッズ</dt><dd>${esc(h.odds_cell||h.odds)}</dd>
    </dl>
    ${(h.hsr>=8&&h.hsr<=10&&/逃|先/.test(h.kyaku))?`<div class="callout">
      <b>HS8-10位 × 前で運ぶ脚質</b>　3着へ飛び込む率が逃げ1.5倍・先行1.4倍（全4841鞍）。
      機械の相手網（HS2-7位）には入らない位置。</div>`:""}
    <textarea class="memo" id="hmemo" rows="2" placeholder="なぜ気になるか">${esc(mk?mk.note:"")}</textarea>
    <div class="btns">
      <button onclick="closeM()">閉じる</button>
      <button class="fill" onclick="mark(${h.num})">${mk?"★ 注目を外す":"★ この鞍に注目を追加"}</button>
    </div>`;
  $("modal").classList.add("on");
}
function mark(num){
  const h=(PACK.horses||[]).find(x=>+x.num===+num);
  const p=ensurePick("検討中");
  const i=p.marks.findIndex(m=>+m.num===+num);
  const note=($("hmemo")&&$("hmemo").value||"").trim();
  if(i>=0)p.marks.splice(i,1);
  else p.marks.push({num:h.num,name:h.name,jk:h.jk,heads:PACK.heads,
                     note:note||`HS${h.hsr}位・${h.pop}人気`});
  savePicks(); closeM(); drawRace(); drawHome();
}
function closeM(){$("modal").classList.remove("on");}
function go(v){
  const home=v==="home";
  $("v-home").classList.toggle("hide",!home);
  $("v-race").classList.toggle("hide",home);
  $("brand").classList.toggle("hide",!home);
  $("backb").classList.toggle("hide",home);
  $("ttl").classList.toggle("hide",home);
  if(home)$("labbtn").classList.add("hide");
  window.scrollTo(0,0);
}
(async()=>{
  try{
    TODAY=JSON.parse(await fetchDoc("00_published/TODAY.json"));
    try{IDX=JSON.parse(await fetchDoc("00_published/p2/index.json"));}catch(e){IDX={races:[]};}
    drawHome();
  }catch(e){
    $("homeload").classList.add("hide");
    $("homebody").innerHTML = e.message==="NOSETUP"
      ? `<div class="err setup"><b>初回設定</b><br>リポジトリとトークンを保存してください。
          <input id="repo" placeholder="hir019inc/keiba-yosou">
          <input id="token" type="password" placeholder="GitHub トークン">
          <div class="btns"><button class="fill" onclick="saveSetup()">保存して読み込む</button></div></div>`
      : `<div class="err"><b>読み込めません</b><br>${esc(e.message)}</div>`;
  }
})();
function saveSetup(){
  try{localStorage.setItem(LS.repo,$("repo").value.trim());
      localStorage.setItem(LS.token,$("token").value.trim());}catch(e){}
  location.reload();
}
setInterval(()=>{ if(!$("v-home").classList.contains("hide")&&TODAY) drawHome(); }, 60000);
</script>
</body></html>
