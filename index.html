<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>競馬予想ビュー</title>
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<meta name="apple-mobile-web-app-title" content="競馬ビュー">
<style>
  /* 白バック固定（2026-08-26ユーザー指定・ダークモード廃止） */
  :root { --bg:#f5f6f8; --card:#fff; --fg:#1a1a1a; --line:#e2e5ea; --accent:#1c4587;
          --sub:#68707c; --chip:#eef1f6; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--fg);
         font-family:-apple-system,"Hiragino Sans",sans-serif; font-size:14px; }
  header { position:sticky; top:0; background:var(--bg); border-bottom:1px solid var(--line);
           padding:8px 10px; display:flex; gap:8px; align-items:center; z-index:9; }
  header h1 { font-size:15px; margin:0; flex:1; }
  header button, header select {
    font-size:13px; padding:5px 9px; border:1px solid var(--line); border-radius:6px;
    background:var(--card); color:var(--fg); }
  main { padding:10px; max-width:640px; margin:0 auto; }
  .meta { color:var(--sub); font-size:12px; margin:4px 2px 10px; }
  .seg { display:flex; gap:5px; margin:0 0 8px; overflow-x:auto; }
  .seg button { flex:1 0 auto; font-size:12.5px; padding:7px 10px; border:1px solid var(--line);
                border-radius:8px; background:var(--card); color:var(--fg); white-space:nowrap; }
  .seg button.on { background:var(--accent); border-color:var(--accent); color:#fff; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:12px;
          padding:10px 12px; margin:0 0 10px; }
  .p1c { padding:8px 10px; margin:0 0 8px; }
  .p1c .c2 { margin:5px 0 3px; }
  .p1c .c3 { margin:0 0 6px; }
  .p1c .jk { color:var(--sub); font-size:12px; }
  .p1c .pay { padding:3px 2px; }
  .p1c .pay .v { font-size:13px; }
  .cardh { font-weight:700; font-size:14.5px; color:var(--accent); margin-bottom:6px; }
  .c1 { display:flex; align-items:baseline; gap:8px; color:var(--sub); font-size:12px;
        flex-wrap:wrap; }
  .c1 .t { color:var(--fg); font-weight:600; font-size:13px; }
  .c2 { display:flex; align-items:center; gap:8px; margin:6px 0 2px; flex-wrap:wrap; }
  .num { display:inline-flex; align-items:center; justify-content:center; min-width:26px;
         height:26px; border-radius:6px; font-weight:700; font-size:14px; padding:0 4px;
         border:1px solid transparent; }
  .num.s { min-width:22px; height:22px; font-size:12.5px; }
  .name { font-size:17px; font-weight:700; }
  .pop { font-size:12px; color:var(--sub); border:1px solid var(--line);
         border-radius:99px; padding:1px 8px; }
  .c3 { display:flex; gap:14px; color:var(--sub); font-size:12.5px; margin:4px 0 8px;
        flex-wrap:wrap; }
  .c3 b { color:var(--fg); font-weight:600; }
  .pays { display:flex; gap:6px; }
  .pay { flex:1; background:var(--chip); border-radius:8px; text-align:center; padding:5px 2px; }
  .pay .v { font-weight:700; font-size:14px; }
  .pay .k { font-size:10.5px; color:var(--sub); }
  /* TODAYレース別カード */
  .axis { display:flex; align-items:center; gap:8px; margin:8px 0 4px; flex-wrap:wrap; }
  .axis .tag { font-size:11px; font-weight:700; color:#fff; background:var(--accent);
               border-radius:4px; padding:2px 6px; }
  .aname { font-size:16px; font-weight:700; }
  .hsv { color:var(--sub); font-size:12.5px; }
  .mates { margin:6px 0 0; }
  .mate { display:flex; align-items:center; gap:7px; padding:5px 0;
          border-top:1px solid var(--line); font-size:13px; }
  .mate .rk { color:var(--sub); font-size:11.5px; width:16px; text-align:right; }
  .mate .mn { font-weight:600; }
  .mate .myo { font-size:10.5px; font-weight:700; color:var(--accent);
               border:1px solid var(--accent); border-radius:4px; padding:0 4px; }
  .mate .sd { color:var(--sub); font-size:11.5px; margin-left:auto; text-align:right; }
  .tnote { color:var(--sub); font-size:11.5px; line-height:1.6; }
  .tsub { font-weight:700; margin:10px 0 2px; }
  .tlist { margin:6px 0; padding-left:0; list-style:none; }
  .tlist li { padding:7px 0; border-top:1px solid var(--line); line-height:1.55; }
  h2 { font-size:14px; margin:16px 2px 8px; color:var(--accent); }
  p  { margin:6px 0; line-height:1.6; overflow-wrap:anywhere; }
  .tablewrap { overflow-x:auto; -webkit-overflow-scrolling:touch; margin:8px 0 16px;
               border:1px solid var(--line); border-radius:6px; background:var(--card); }
  table { border-collapse:collapse; white-space:nowrap; font-size:12.5px; width:max-content; }
  th, td { padding:4px 7px; border-bottom:1px solid var(--line); text-align:left; }
  thead th { background:var(--card); color:var(--accent); border-bottom:2px solid var(--accent); }
  #setup { max-width:520px; margin:30px auto; padding:0 14px; }
  #setup input { width:100%; font-size:14px; padding:8px; margin:6px 0;
                 border:1px solid var(--line); border-radius:6px;
                 background:var(--card); color:var(--fg); }
  #setup button { font-size:14px; padding:8px 16px; border-radius:6px;
                  border:1px solid var(--accent); background:var(--accent); color:#fff; }
  .err { color:#c0392b; }
  .note { color:var(--sub); font-size:12px; line-height:1.7; }
  footer { color:var(--sub); font-size:11.5px; line-height:1.7; margin:18px 2px; }
  .hm { width:100%; border-collapse:separate; border-spacing:3px; table-layout:fixed; }
  .hm th { font-size:11px; color:var(--sub); font-weight:600; padding:2px 0; border:0;
           text-align:center; background:transparent; }
  .hm th:first-child { width:34%; }
  .hm td { border-radius:6px; text-align:center; padding:8px 2px; font-weight:700;
           font-size:13px; border:0; white-space:nowrap; overflow:hidden; }
  .hm td.lbl { background:transparent; text-align:left; font-weight:600; font-size:11.5px;
               color:var(--fg); padding:8px 0; }
  .hm .lp { color:var(--sub); font-weight:400; font-size:11px; }
  .grid2 { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
  .gcol h3 { font-size:12.5px; margin:2px 0 6px; color:var(--sub); font-weight:600; }
  .mv { background:var(--card); border:1px solid var(--line); border-radius:10px;
        padding:7px 8px; margin-bottom:6px; }
  .mv .l1 { display:flex; align-items:center; gap:6px; font-size:12px; color:var(--sub); }
  .mv .l1 b { color:var(--fg); }
  .mv .l2 { font-size:13px; font-weight:600; margin:3px 0; }
  .bar { height:6px; border-radius:3px; background:var(--chip); overflow:hidden; }
  .bar i { display:block; height:100%; border-radius:3px; }
  .trk { position:relative; height:12px; margin-top:5px; background:var(--chip);
         border-radius:6px; }
  .trk u { position:absolute; top:0; width:1px; height:100%; background:var(--line); }
  .trk .seg { position:absolute; top:4px; height:4px; border-radius:2px; opacity:.55; }
  .trk .d0 { position:absolute; top:2.5px; width:7px; height:7px; border-radius:50%;
             background:var(--card); border:1.5px solid; margin-left:-4px; }
  .trk .d1 { position:absolute; top:1.5px; width:9px; height:9px; border-radius:50%;
             margin-left:-5px; }
  .al { background:var(--card); border:1px solid var(--line); border-radius:10px;
        padding:7px 8px; margin-bottom:6px; }
  .al .l1 { display:flex; align-items:center; gap:6px; }
  .al .nm { font-weight:700; font-size:13.5px; }
  .al .l2 { color:var(--sub); font-size:11.5px; margin-top:3px; display:flex; gap:8px;
            align-items:center; flex-wrap:wrap; }
  .gq { display:inline-flex; align-items:center; justify-content:center; min-width:20px;
        height:18px; border-radius:4px; color:#fff; font-size:11px; font-weight:700; }
  .nrow { display:flex; align-items:center; gap:8px; background:var(--card);
          border:1px solid var(--line); border-radius:10px; padding:8px 10px;
          margin-bottom:7px; }
  .nrow .t { color:var(--sub); font-size:11.5px; width:88px; flex:none; line-height:1.4; }
  .nrow .t b { color:var(--fg); font-size:12.5px; }
  .nrow .h { flex:1; min-width:0; display:flex; align-items:center; gap:6px; }
  .nrow .h .nm { font-weight:700; font-size:14px; overflow:hidden;
                 text-overflow:ellipsis; white-space:nowrap; }
  .vchip { flex:none; border-radius:8px; text-align:center; padding:4px 8px; }
  .vchip .v { font-weight:700; font-size:14px; }
  .vchip .k { font-size:9.5px; opacity:.75; }
  .qrow { display:flex; align-items:center; gap:8px; padding:6px 0;
          border-top:1px solid var(--line); }
  .qrow .t { color:var(--sub); font-size:11.5px; width:92px; flex:none; }
  .qrow .t b { color:var(--fg); font-size:12.5px; }
  .qbar { flex:1; display:flex; height:12px; border-radius:6px; overflow:hidden;
          background:var(--chip); }
  .qbar i { display:block; height:100%; }
  .qrow .c { flex:none; font-size:10.5px; color:var(--sub); width:88px; text-align:right; }
  .agrow { display:flex; align-items:center; gap:8px; padding:7px 0;
           border-top:1px solid var(--line); }
  .agrow .rk { color:var(--sub); font-size:11.5px; width:18px; text-align:right; }
  .agrow .nm { font-weight:600; font-size:13.5px; }
  .agrow .sd { margin-left:auto; color:var(--sub); font-size:11.5px; text-align:right; }
  .agrow .vv { font-weight:700; font-size:14px; color:var(--fg); }
  .mx { width:100%; border-collapse:separate; border-spacing:3px; table-layout:fixed; }
  .mx th { font-size:10.5px; color:var(--sub); font-weight:600; padding:2px 0; border:0;
           text-align:center; line-height:1.3; background:transparent; }
  .mx th:first-child { width:19%; }
  .mx td.cell { background:var(--card); border:1px solid var(--line); border-radius:8px;
                vertical-align:top; padding:4px; }
  .mx .chips { display:flex; flex-wrap:wrap; gap:3px; min-height:24px; }
  .mx td.glbl { background:transparent; border:0; font-size:10.5px; color:var(--sub);
                font-weight:600; text-align:center; }
  .rchip { display:inline-flex; flex-direction:column; align-items:center; border-radius:7px;
           padding:4px 7px; line-height:1.2; min-width:40px; }
  .rchip b { font-size:12.5px; font-weight:700; }
  .rchip i { font-style:normal; font-size:10.5px; opacity:.85; }
</style>

<body>
<header>
  <h1 id="title">競馬予想ビュー</h1>
  <select id="doc">
    <option value="00_published/P1_TODAY.md">P1選定</option>
    <option value="HEATMAP">P1ヒートマップ</option>
    <option value="TODAYV4">TODAY</option>
  </select>
  <button id="reload" title="再読込">更新</button>
</header>
<main>
  <div id="setup" hidden>
    <h2>初回設定（この端末に保存されます）</h2>
    <p class="note">GitHubの読み取り専用トークンを貼り付けてください。<br>
      作り方: github.com/settings/personal-access-tokens/new →
      対象リポジトリを keiba-yosou のみ・権限は Contents: Read-only で発行。<br>
      トークンはこの端末のブラウザ内にだけ保存され、外部には送られません
      （通信先はGitHub APIのみ）。</p>
    <input id="repo" placeholder="owner/repo（例 hir019inc/keiba-yosou）">
    <input id="token" placeholder="github_pat_..." type="password">
    <button id="save">保存して表示</button>
    <p id="setuperr" class="err"></p>
  </div>
  <div id="view"></div>
</main>
<script>
"use strict";
const LS = { repo:"kv_repo", token:"kv_token" };
const $ = id => document.getElementById(id);
const esc = s => s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
const inline = t => t.split("<br>").map(x=>esc(x)).join("<br>")
                     .replace(/\*\*(.+?)\*\*/g, "<b>$1</b>");
let state = { ba:"all", tm:"all", ttab:0 };
let lastText = "", lastPath = "";

/* ---------- 枠色（JRA 8枠・馬番+頭数から枠を計算） ---------- */
const WAKU = [null,
  ["#ffffff","#333","#9aa1ab"], ["#222222","#fff","#222"], ["#e63946","#fff","#e63946"],
  ["#1d6fd6","#fff","#1d6fd6"], ["#f6d32d","#333","#e3bd0e"], ["#2e9e4f","#fff","#2e9e4f"],
  ["#f28c28","#fff","#f28c28"], ["#f4a7c3","#333","#eb8fb2"]];
function waku(num, heads){
  num = +num; heads = +heads;
  if (!num || !heads) return 0;
  if (heads <= 8) return num;
  const base = Math.floor(heads/8), rem = heads % 8;
  let cum = 0;
  for (let f = 1; f <= 8; f++){
    cum += base + (f > 8 - rem ? 1 : 0);
    if (num <= cum) return f;
  }
  return 8;
}
function numBadge(num, heads, small){
  const w = waku(num, heads);
  const [bg, fg, bd] = WAKU[w] || ["var(--accent)","#fff","transparent"];
  return `<span class="num${small?" s":""}" style="background:${bg};color:${fg};border-color:${bd}">${esc(String(num))}</span>`;
}

/* ---------- 配当の色分け（倍率の大きさ・単色系グラデ） ---------- */
function heat(v){
  const x = parseFloat(v);
  if (isNaN(x))  return ["#f2f4f7","#68707c"];
  if (x < 10)    return ["#eef1f6","#5a6472"];   // トリガミ帯
  if (x < 50)    return ["#fff3d0","#6b5410"];
  if (x < 150)   return ["#ffdca8","#7a4a00"];
  if (x < 500)   return ["#ffb27d","#7a2e00"];
  if (x < 2000)  return ["#f2603d","#ffffff"];
  return ["#b8232f","#ffffff"];                  // 万馬券帯の奥
}
function heatCell(v, cls, label){
  const [bg,fg] = heat(v);
  return `<div class="${cls}" style="background:${bg};color:${fg}">
    <div class="v">${esc(v)}</div>${label?`<div class="k" style="color:${fg};opacity:.75">${label}</div>`:""}</div>`;
}

/* ---------- P1: カード描画（場×時間帯フィルタ） ---------- */
function parseP1(md){
  const races = []; let note = "";
  for (const raw of md.split("\n")){
    const line = raw.trim();
    if (line.startsWith("※")) { note += line + " "; continue; }
    if (!line.startsWith("|") || line.includes("発走 |") || /^\|[\s:|-]+\|$/.test(line)) continue;
    const c = line.replace(/^\||\|$/g,"").split("|").map(x=>x.trim());
    if (c.length < 10) continue;
    const m = c[5].match(/^(\d+)番(.+?)\((.+?)\)$/) || [];
    const ba = (c[1].match(/^\D+/)||[""])[0];
    const hour = parseInt(c[0].split(":")[0] || "0");
    races.push({ time:c[0], hour, place:c[1], rname:c[2], ba, course:c[3], heads:c[4],
                 num:m[1]||"?", name:m[2]||c[5], pop:m[3]||"-",
                 jockey:c[6], odds:c[7], hs:c[8], pay:c[9].split("/") });
  }
  return { races, note };
}
const TM = [["all","全て"],["a","～11時"],["b","11-14"],["c","14-16"],["d","16時～"]];
const tmOf = h => h<11 ? "a" : h<14 ? "b" : h<16 ? "c" : "d";
function renderP1(md){
  const {races, note} = parseP1(md);
  if (!races.length) return null;
  const bas = ["all", ...new Set(races.map(r=>r.ba))];
  let h = [];
  h.push(`<div class="seg">` + bas.map(b =>
    `<button data-f="ba:${b}" class="${state.ba===b?"on":""}">${b==="all"?"全場":esc(b)}</button>`).join("") + `</div>`);
  h.push(`<div class="seg">` + TM.map(([k,l]) =>
    `<button data-f="tm:${k}" class="${state.tm===k?"on":""}">${l}</button>`).join("") + `</div>`);
  h.push(`<p class="meta" style="margin:0 2px 8px">配当チップ＝左から 最低/低/中/高（倍・HS上位7頭）</p>`);
  let shown = 0;
  for (const r of races){
    if (state.ba!=="all" && r.ba!==state.ba) continue;
    if (state.tm!=="all" && tmOf(r.hour)!==state.tm) continue;
    shown++;
    h.push(`<div class="card p1c">
      <div class="c1"><span class="t">${esc(r.time)} ${esc(r.place)}</span>
        <span>${esc(r.rname||"")}</span><span>${esc(r.course)}・${esc(r.heads)}頭</span>
        <span class="pop" style="margin-left:auto">${esc(r.pop)}気</span></div>
      <div class="c2">${numBadge(r.num, r.heads)}
        <span class="name">${esc(r.name)}</span>
        <span class="jk">${esc(r.jockey)}</span></div>
      <div class="c3"><span>オッズ <b>${esc(r.odds)}</b></span>
        <span>HS <b>${esc(r.hs)}</b></span></div>
      <div class="pays">${r.pay.map(v=>heatCell(v,"pay")).join("")}</div>
    </div>`);
  }
  if (!shown) h.push(`<p class="note">該当するレースがありません</p>`);
  h.push(`<footer>${esc(note)}<br>
    HS1位=参考スコア1位（軸ではない・軸はP2で決める）。オッズ=前日初値→最新。
    HS=値(2位との差)。配当=HS上位7頭BOX35組の3連複オッズ：最低=最も人気側の組（床）／
    低・中・高=安い順3等分の各グループ中央値（この7頭内の相対区分）。取得時点の値。
    馬番の色=枠色（馬番と頭数から算出）。</footer>`);
  return h.join("");
}

/* ---------- P1ヒートマップ: 人気帯×gap帯のマトリクス（狩場の俯瞰） ----------
   P1一覧(レース単位の値)とは切り口を変える(2026-08-26レビュー):
   列=HS1位の人気帯(市場の評価) / 行=gap帯(モデルの確信) / チップ色=配当・中。 */
const POPB = [["1-2","1-2人気"],["3","3人気"],["4-6","4-6人気"],["7-","7人気-"]];
function popBand(p){ const n=parseInt(p); if(!n) return null;
  return n<=2?"1-2": n===3?"3": n<=6?"4-6":"7-"; }
const GAPB = [["lo","gap<2"],["mid","gap2-6"],["hi","gap6+"]];
function gapBand(hs){ const m=String(hs).match(/\(([\d.]+)\)/); const g=m?parseFloat(m[1]):NaN;
  return isNaN(g)?null: g>=6?"hi": g>=2?"mid":"lo"; }
function renderHeatmap(md){
  const {races} = parseP1(md);
  if (!races.length) return null;
  // 絞り込みタブなし＝1日全体の俯瞰ビュー(2026-08-26レビューで撤去)
  let h = [];
  const grid = {};
  let shown = 0;
  for (const r of races){
    const pb = popBand(r.pop), gb = gapBand(r.hs);
    if (!pb || !gb) continue;
    shown++;
    (grid[gb+"|"+pb] ??= []).push(r);
  }
  // 行=人気帯 / 列=gap帯(左→右で増加) 2026-08-26レビューで縦横入替
  h.push(`<table class="mx"><thead><tr><th></th>` +
    GAPB.map(([k,l])=>`<th>${esc(l)}</th>`).join("") + `</tr></thead><tbody>`);
  for (const [pk, pl] of POPB){
    h.push(`<tr><td class="glbl">${esc(pl)}</td>`);
    for (const [gk] of GAPB){
      const rs = grid[gk+"|"+pk] || [];
      h.push(`<td class="cell"><div class="chips">` + rs.map(r=>{
        const mid = r.pay[2] ?? r.pay[1];
        const [bg,fg] = heat(mid);
        return `<span class="rchip" style="background:${bg};color:${fg}"><b>${esc(r.ba[0])}${esc(r.place.replace(/\D+/,""))}</b><i>${esc(mid??"-")}</i></span>`;
      }).join("") + `</div></td>`);
    }
    h.push(`</tr>`);
  }
  h.push("</tbody></table>");
  if (!shown) h.push(`<p class="note">該当するレースがありません</p>`);
  h.push(`<footer>縦=HS1位が何番人気か／横=HS1位とHS2位の差（gap・右ほど抜けている）。
    下の行ほどモデルと市場が割れている鞍・右の列ほどモデル内で抜けている鞍。
    チップ=鞍（上段=場の頭文字+R番号・下段=配当・中の倍率）。チップの色=配当・中
    （HS上位7頭BOX35組の中間グループ中央値。〜10/〜50/〜150/〜500/〜2000/2000超の6段階）。
    個別の値はP1選定カードで。</footer>`);
  return h.join("");
}

/* ---------- TODAY: セクションをタブ化・レース別は専用カード ---------- */
function splitSections(md){
  const secs = []; let cur = null; let intro = [];
  for (const raw of md.split("\n")){
    const line = raw.trimEnd();
    if (line.startsWith("## ")){
      cur = { title: line.slice(3).trim(), lines: [] };
      secs.push(cur); continue;
    }
    if (line.startsWith("# ")) continue;
    (cur ? cur.lines : intro).push(line);
  }
  return { intro, secs };
}
function renderTodayGeneric(lines){
  let out = [`<div class="card">`], list = null;
  const closeList = ()=>{ if(list){ out.push("</ul>"); list=null; } };
  for (const raw of lines){
    const line = raw.trim();
    if (!line || line==="---"){ closeList(); continue; }
    if (line.startsWith("- ")){
      if (!list){ out.push('<ul class="tlist">'); list=true; }
      out.push(`<li>${inline(line.slice(2))}</li>`); continue;
    }
    closeList();
    if (line.startsWith("※")) out.push(`<p class="tnote">${inline(line)}</p>`);
    else if (line.startsWith("**") && line.endsWith("**")) out.push(`<p class="tsub">${inline(line)}</p>`);
    else out.push(`<p>${inline(line)}</p>`);
  }
  closeList(); out.push("</div>");
  return out.join("");
}
function renderTodayRaces(lines){
  // <details>ブロック=1レース。summary + 中身をカード化。解析不能な行はそのまま小さく出す。
  const blocks = []; let cur = null;
  for (const raw of lines){
    const line = raw.trim();
    if (line.startsWith("<details")){ cur = {summary:"", body:[]}; continue; }
    if (line.startsWith("</details")){ if(cur) blocks.push(cur); cur=null; continue; }
    if (!cur) continue;
    const sm = line.match(/<summary>(.*)<\/summary>/);
    if (sm){ cur.summary = sm[1]; continue; }
    if (line) cur.body.push(line);
  }
  if (!blocks.length) return renderTodayGeneric(lines);
  const out = [];
  for (const b of blocks){
    const s = b.summary.match(/^([\d:]+)\s*(［.］)?\s*(\S+?R)\s/) || [];
    const heads = (b.body.join(" ").match(/(\d+)頭/)||[])[1];
    let head = `<div class="c1"><span class="t">${esc(s[1]||"")} ${esc(s[3]||b.summary)}</span>`
             + (s[2]?`<span>${esc(s[2])}</span>`:"") + `</div>`;
    let axis = "", metas = [], mates = [], extras = [];
    for (const line of b.body){
      let m;
      if ((m = line.match(/^\*\*［軸］(\d+)番(.+?)\*\*\s+HS([\d.]+)(?:<br>(.*))?$/))){
        axis = `<div class="axis"><span class="tag">軸</span>${numBadge(m[1],heads)}
          <span class="aname">${esc(m[2])}</span><span class="hsv">HS${esc(m[3])}</span></div>`
          + (m[4]?`<p class="tnote">${inline(m[4])}</p>`:"");
      } else if ((m = line.match(/^(\d+)\.\s+\*\*(【妙】)?(\d+)番(.+?)\*\*\s+HS([\d.]+)(?:<br>(.*))?$/))){
        mates.push(`<div class="mate"><span class="rk">${esc(m[1])}</span>
          ${numBadge(m[3],heads,true)}<span class="mn">${esc(m[4])}</span>
          ${m[2]?'<span class="myo">妙</span>':""}
          <span class="sd">HS${esc(m[5])}${m[6]?"・"+esc(m[6].split("・").slice(1).join("・")):""}</span></div>`);
      } else if (line.startsWith("**相手候補")){
        continue;
      } else if (line.startsWith("**") || line.startsWith("支持") || line.startsWith("- ") || line.startsWith("※")){
        extras.push(`<p class="tnote">${inline(line.replace(/^- /,""))}</p>`);
      } else {
        metas.push(inline(line));
      }
    }
    out.push(`<div class="card">${head}${axis}
      <p class="tnote">${metas.join("<br>")}</p>
      ${mates.length?`<div class="mates">${mates.join("")}</div>`:""}
      ${extras.join("")}</div>`);
  }
  return out.join("");
}
function renderToday(md){
  const {intro, secs} = splitSections(md);
  if (!secs.length) return renderTodayGeneric(md.split("\n"));
  if (state.ttab >= secs.length) state.ttab = 0;
  let h = [];
  h.push(`<div class="seg">` + secs.map((s,i)=>
    `<button data-f="tt:${i}" class="${state.ttab===i?"on":""}">${esc(s.title.split("（")[0].replace(/\s*\d+鞍$/,""))}</button>`).join("") + `</div>`);
  const sec = secs[state.ttab];
  h.push(sec.title.startsWith("レース別") ? renderTodayRaces(sec.lines)
                                         : renderTodayGeneric(sec.lines));
  return h.join("");
}

/* ---------- TODAY(V4/JSON): 専用描画 ---------- */
const QCOL = {A:"#2e9e4f", B:"#9ec43c", C:"#f2a03d", D:"#e63946", "-":"#c9d2de"};
function gq(g){ return `<span class="gq" style="background:${QCOL[g]||QCOL["-"]}">${esc(g)}</span>`; }
function renderTodayJson(d){
  const tabs = [["nerai","狙い別"],["odds","オッズ動向"],
                ["alerts",`大穴 ${d.alerts.length}頭`],["chokyo","調教"],["agari","上がり上位"]];
  if (state.ttab >= tabs.length) state.ttab = 0;
  let h = [`<p class="meta">生成 ${esc(d.generated)}・${esc(d.venues.join(" "))} ${d.races}R</p>`];
  h.push(`<div class="seg">` + tabs.map((t,i)=>
    `<button data-f="tt:${i}" class="${state.ttab===i?"on":""}">${t[1]}</button>`).join("") + `</div>`);
  const key = tabs[state.ttab][0];
  if (key==="nerai") h.push(renderNerai(d));
  else if (key==="odds") h.push(renderOddsMoves(d));
  else if (key==="alerts") h.push(renderAlerts(d));
  else if (key==="chokyo") h.push(renderChokyo(d));
  else h.push(renderAgari(d));
  return h.join("");
}
function renderNerai(d){
  if (!d.p1_available) return `<p class="note">P1表が未生成のため配当条件が判定できません（8時台に自動生成）。</p>`;
  if (state.ntab === undefined) state.ntab = 0;
  const n = d.nerai[state.ntab] || d.nerai[0];
  let h = [`<div class="seg">` + d.nerai.map((x,i)=>
    `<button data-f="nt:${i}" class="${state.ntab===i?"on":""}">${esc(x.label)}</button>`).join("") + `</div>`];
  h.push(`<p class="meta">条件: ${esc(n.cond)}・${esc(n.vlabel)}の高い順・全${n.races.length}鞍</p>`);
  for (const r of n.races){
    const [bg,fg] = heat(r.value);
    h.push(`<div class="nrow">
      <div class="t"><b>${esc(r.time||"-")} ${esc(r.place)}</b><br>${esc(r.name||"")} ${esc(r.course||"")}</div>
      <div class="h">${numBadge(r.hs1num, r.heads)}<span class="nm">${esc(r.hs1name||"")}</span>
        <span class="pop">${esc(String(r.pop||"-"))}人気</span></div>
      <div class="vchip" style="background:${bg};color:${fg}">
        <div class="v">${esc(String(r.value))}倍</div><div class="k">${esc(n.vlabel)}</div></div>
    </div>`);
  }
  if (!n.races.length) h.push(`<p class="note">該当なし</p>`);
  return h.join("");
}
function renderOddsMoves(d){
  // オッズ帯の移動を対数目盛(1〜500倍)上で表す: 白丸=前日初値 → 色丸=現在。
  // 変化率バーは+100%超が並ぶと全て振り切って区別できないため置き換え(2026-08-26)。
  const X = o => Math.max(0, Math.min(1, Math.log10(Math.max(1, o)) / Math.log10(500))) * 100;
  const MARKS = [2, 10, 50, 200];
  const col = (title, items, color) => `<div class="gcol"><h3>${title}</h3>` + items.map(m=>{
    const x0 = X(m.o0), x1 = X(m.o1);
    const l = Math.min(x0, x1), w = Math.max(1.5, Math.abs(x1 - x0));
    return `<div class="mv">
      <div class="l1">${numBadge(m.num, m.heads, true)}<b>${esc(m.place)}</b><span>${esc(m.time||"-")}</span>
        <span style="margin-left:auto">${esc(String(m.o0))}→<b>${esc(String(m.o1))}倍</b></span></div>
      <div class="trk">${MARKS.map(v=>`<u style="left:${X(v)}%"></u>`).join("")}
        <i class="seg" style="left:${l}%;width:${w}%;background:${color}"></i>
        <i class="d0" style="left:${x0}%;border-color:${color}"></i>
        <i class="d1" style="left:${x1}%;background:${color}"></i></div>
    </div>`;}).join("") + `</div>`;
  return `<p class="meta">前日初値(白丸)→最新(色丸)のオッズ帯の移動。<br>
    目盛=対数(左端1倍・線は2/10/50/200倍)＝左ほど人気側。毎時更新・数値のみ。</p>
    <div class="grid2">${col("オッズ低下(左へ)", d.odds.down, "#1d6fd6")}
    ${col("オッズ上昇(右へ)", d.odds.up, "#f28c28")}</div>`;
}
const ASORT = [["rank","HS位順"],["time","発走順"],["pop","人気薄順"]];
const AQ = [["all","全て"],["ab","調A・B"],["a","調Aのみ"]];
function renderAlerts(d){
  state.asort ??= "rank"; state.aq ??= "all";
  let items = [...d.alerts];
  if (state.aq==="ab") items = items.filter(x=>x.qual==="A"||x.qual==="B");
  if (state.aq==="a")  items = items.filter(x=>x.qual==="A");
  if (state.asort==="time") items.sort((a,b)=>(a.time||"").localeCompare(b.time||""));
  else if (state.asort==="pop") items.sort((a,b)=>b.pop-a.pop || a.rank-b.rank);
  else items.sort((a,b)=>a.rank-b.rank || b.pop-a.pop);
  let h = [`<div class="seg">` + ASORT.map(([k,l])=>
    `<button data-f="as:${k}" class="${state.asort===k?"on":""}">${l}</button>`).join("") + `</div>`];
  h.push(`<div class="seg">` + AQ.map(([k,l])=>
    `<button data-f="aq:${k}" class="${state.aq===k?"on":""}">${l}</button>`).join("") + `</div>`);
  h.push(`<p class="meta">HS7位以内 × 8番人気以下・${items.length}頭（毎時更新）</p><div class="grid2">`);
  h.push(items.map(x=>`<div class="al">
      <div class="l1">${numBadge(x.num, x.heads, true)}<span class="nm">${esc(x.name)}</span></div>
      <div class="l2"><span>${esc(x.time||"-")} ${esc(x.place)} ${esc(x.course||"")}・${esc(x.style||"-")}</span></div>
      <div class="l2"><span>${x.pop}人気 ${esc(String(x.odds??"-"))}倍</span>
        <span>HS${x.rank}位</span>${gq(x.qual)}</div>
    </div>`).join(""));
  h.push(`</div>`);
  return h.join("");
}
function renderChokyo(d){
  let h = [`<div class="card"><div class="cardh">A評価 ${d.chokyo.a.length}頭（前日確定）</div>`];
  h.push(d.chokyo.a.map(x=>`<div class="qrow">
      <div class="t"><b>${esc(x.time||"-")} ${esc(x.place)}</b></div>
      <div class="h" style="flex:1;display:flex;align-items:center;gap:6px">
        ${numBadge(x.num, x.heads, true)}<span style="font-weight:600">${esc(x.name)}</span>
        <span class="tnote">${esc(x.tanpyo||"")}</span></div>
    </div>`).join("") || `<p class="note">該当なし</p>`);
  h.push(`</div>`);
  h.push(`<div class="card"><div class="cardh">レース別の評価分布（A割合→D割合順）</div>
    <p class="tnote">バー=出走頭数に対するA/B/C/Dの割合（緑→赤）。上ほどAの割合が高い鞍。</p>`);
  for (const q of d.chokyo.dist){
    const n = q.heads || (q.A+q.B+q.C+q.D) || 1;
    const seg = g => q[g] ? `<i style="width:${q[g]/n*100}%;background:${QCOL[g]}"></i>` : "";
    h.push(`<div class="qrow"><div class="t"><b>${esc(q.time||"-")} ${esc(q.place)}</b></div>
      <div class="qbar">${seg("A")}${seg("B")}${seg("C")}${seg("D")}</div>
      <div class="c">A${q.A} B${q.B} C${q.C} D${q.D}</div></div>`);
  }
  h.push(`</div>`);
  return h.join("");
}
function renderAgari(d){
  return `<p class="meta">僅差時上がり（着差0.5以内で出した最速3F）の全場上位20頭</p><div class="card">`
    + d.agari.map((x,i)=>`<div class="agrow"><span class="rk">${i+1}</span>
      ${numBadge(x.num, x.heads, true)}<span class="nm">${esc(x.name)}</span>
      <span class="sd">${esc(x.time||"-")} ${esc(x.place)} ${esc(x.course||"")}・${esc(x.style)}・${x.pop??"-"}人<br>
      <span class="vv">${x.val.toFixed(1)}</span> <span>記録:${esc(x.src||"-")}</span></span>
    </div>`).join("") + `</div>`;
}

/* ---------- 汎用（予備） ---------- */
function mdToHtml(md){
  const lines = md.split("\n");
  let html = [], tbl = null;
  const flushT = () => { if (tbl){ html.push(renderTable(tbl)); tbl = null; } };
  for (const raw of lines){
    const line = raw.replace(/<br>/g,"").trimEnd();
    if (line.startsWith("|")){ (tbl ??= []).push(line); continue; }
    flushT();
    if (!line.trim()) continue;
    if (line.startsWith("#")) html.push(`<h2>${esc(line.replace(/^#+\s*/,""))}</h2>`);
    else if (line.startsWith("■")) html.push(`<h2>${esc(line)}</h2>`);
    else html.push(`<p>${esc(line)}</p>`);
  }
  flushT();
  return html.join("\n");
}
function renderTable(rows){
  const cells = r => r.replace(/^\||\|$/g,"").split("|").map(c=>c.trim());
  let h = ["<div class=tablewrap><table>"];
  rows.forEach((r,i)=>{
    if (/^\|[\s:|-]+\|$/.test(r)) return;
    const tag = i===0 ? "th" : "td";
    if (i===0) h.push("<thead>");
    if (i===2) h.push("<tbody>");
    h.push("<tr>"+cells(r).map(c=>`<${tag}>${esc(c)}</${tag}>`).join("")+"</tr>");
    if (i===0) h.push("</thead>");
  });
  h.push("</tbody></table></div>");
  return h.join("");
}

/* ---------- 取得と表示 ---------- */
async function fetchDoc(path){
  try {
    const r = await fetch("../"+path, {cache:"no-store"});
    if (r.ok) return {text: await r.text(), src:"local"};
  } catch(e){}
  const repo = localStorage.getItem(LS.repo), token = localStorage.getItem(LS.token);
  if (!repo || !token) throw new Error("NOSETUP");
  const r = await fetch(`https://api.github.com/repos/${repo}/contents/${encodeURI(path)}`,
    { headers: { "Accept":"application/vnd.github.raw+json",
                 "Authorization":`Bearer ${token}`,
                 "X-GitHub-Api-Version":"2022-11-28" }, cache:"no-store" });
  if (r.status===401 || r.status===403) throw new Error("トークンが無効か権限不足です");
  if (r.status===404) throw new Error("ファイルがまだありません: "+path);
  if (!r.ok) throw new Error("取得失敗 HTTP "+r.status);
  return {text: await r.text(), src:"github"};
}
function renderBody(){
  const doc = $("doc").value;
  if (doc === "HEATMAP") return renderHeatmap(lastText) ?? mdToHtml(lastText);
  if (doc === "TODAYV4"){
    if (lastPath.endsWith(".json")){
      try { return renderTodayJson(JSON.parse(lastText)); }
      catch(e){ return `<p class="err">TODAY.jsonの解析に失敗: ${esc(e.message)}</p>`; }
    }
    return renderToday(lastText);   // mdフォールバック
  }
  return lastPath.includes("P1_TODAY") ? (renderP1(lastText) ?? mdToHtml(lastText))
       : mdToHtml(lastText);
}
async function show(){
  const doc = $("doc").value;
  let path = doc === "HEATMAP" ? "00_published/P1_TODAY.md"
           : doc === "TODAYV4" ? "00_published/TODAY.json" : doc;
  $("view").innerHTML = "<p class=meta>読み込み中…</p>";
  try {
    let got;
    try { got = await fetchDoc(path); }
    catch(e){
      if (doc === "TODAYV4" && e.message !== "NOSETUP"){
        path = "00_published/TODAY.md"; got = await fetchDoc(path);   // 旧md版フォールバック
      } else throw e;
    }
    const {text, src} = got;
    lastText = text; lastPath = path;
    $("setup").hidden = true;
    $("view").innerHTML =
      `<div class=meta>${esc(path.split("/").pop())}（${src==="local"?"ローカル":"GitHub"}・${new Date().toLocaleTimeString("ja-JP",{hour:"2-digit",minute:"2-digit"})} 取得）</div>` + renderBody();
    bindSeg();
  } catch(e){
    if (e.message==="NOSETUP"){ $("setup").hidden=false; $("view").innerHTML=""; }
    else $("view").innerHTML = `<p class=err>${esc(e.message)}</p>`;
  }
}
function bindSeg(){
  document.querySelectorAll(".seg button").forEach(b=>{
    b.onclick = ()=>{
      const [k,v] = b.dataset.f.split(":");
      if (k==="ba") state.ba = v;
      else if (k==="tm") state.tm = v;
      else if (k==="tt") state.ttab = +v;
      else if (k==="nt") state.ntab = +v;
      else if (k==="as") state.asort = v;
      else if (k==="aq") state.aq = v;
      const meta = document.querySelector(".meta")?.outerHTML || "";
      $("view").innerHTML = meta + renderBody();
      bindSeg();
    };
  });
}
$("save").onclick = () => {
  const repo=$("repo").value.trim(), token=$("token").value.trim();
  if(!/^[\w.-]+\/[\w.-]+$/.test(repo)){ $("setuperr").textContent="owner/repo の形式で入力してください"; return; }
  if(!token){ $("setuperr").textContent="トークンを入力してください"; return; }
  try { localStorage.setItem(LS.repo, repo); localStorage.setItem(LS.token, token); }
  catch(e){ $("setuperr").textContent="この環境では保存できません(プライベートブラウズ?)"; return; }
  show();
};
$("reload").onclick = show;
$("doc").onchange = show;
try { if (localStorage.getItem(LS.repo)) $("repo").value = localStorage.getItem(LS.repo); } catch(e){}
show();
