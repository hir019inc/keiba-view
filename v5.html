<!DOCTYPE html>
<html lang="ja"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>D.E.R.B.Y.</title>
<style>
:root{
  --bg:#f2f2f7; --card:#fff; --card2:#f7f7f9; --fg:#000; --fg2:#3c3c43; --sub:#8a8a8e;
  --sep:rgba(60,60,67,.17); --accent:#1c4587; --accent2:#3b6fc4; --accent-l:#eaf0fa;
  --fill:#e9e9eb; --gold:#b8860b; --gold-l:#fff6e0; --green:#1a7f4b; --green-l:#e4f4ea;
  --red:#b3261e; --red-l:#fde8e4;
  --hdr:rgba(242,242,247,.82); --shadow:0 1px 2px rgba(0,0,0,.05),0 0 0 .5px rgba(0,0,0,.04);
}
[data-theme="dark"]{
  --bg:#000; --card:#1c1c1e; --card2:#2c2c2e; --fg:#fff; --fg2:#ebebf5; --sub:#8e8e93;
  --sep:rgba(84,84,88,.65); --accent:#5b8dd9; --accent2:#7aa6e4; --accent-l:#1b2a44;
  --fill:#2c2c2e; --gold:#e0b44c; --gold-l:#3a2f14; --green:#4cd07d; --green-l:#16351f;
  --red:#ff9d90; --red-l:#3a1712;
  --hdr:rgba(0,0,0,.72); --shadow:0 0 0 .5px rgba(255,255,255,.07);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--fg);
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Hiragino Sans",sans-serif;
  font-size:15px;line-height:1.45;letter-spacing:-.01em;
  padding-bottom:calc(40px + env(safe-area-inset-bottom,0px))}
.wrap{max-width:620px;margin:0 auto;padding:0 16px 40px}
header{position:sticky;top:0;z-index:30;background:var(--hdr);
  -webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);
  border-bottom:.5px solid var(--sep)}
.hrow{max-width:620px;margin:0 auto;padding:9px 16px;display:flex;align-items:center;gap:9px;min-height:48px}
.brand{display:flex;align-items:center;gap:9px;flex:1 1 auto;min-width:0}
.silks{display:inline-flex;height:17px;border-radius:3px;overflow:hidden;flex:0 0 auto;
  box-shadow:0 0 0 .5px var(--sep)}
.silks i{width:5px;height:100%;display:block}
.wm{font-size:15.5px;font-weight:800;letter-spacing:.1em;white-space:nowrap}
.back{flex:0 0 auto;display:flex;align-items:center;gap:3px;color:var(--accent2);font-size:16px;
  font-weight:600;letter-spacing:-.02em;background:none;border:0;padding:0;cursor:pointer}
.back svg{width:11px;height:18px;display:block}
.ttl{flex:1 1 auto;min-width:0;font-size:16px;font-weight:700;letter-spacing:-.02em;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lab{flex:0 0 auto;font-size:13px;font-weight:700;color:#fff;background:var(--accent);
  border-radius:99px;padding:5px 13px;text-decoration:none}
.tgl{flex:0 0 auto;width:32px;height:32px;border-radius:99px;border:0;background:var(--fill);
  color:var(--fg);font-size:15px;cursor:pointer}
h1.big{font-size:32px;font-weight:800;letter-spacing:-.04em;margin:18px 2px 2px;line-height:1.12}
.dayhead{display:flex;align-items:baseline;gap:9px;margin:18px 2px 14px;flex-wrap:wrap}
.dayhead .d1{font-size:21px;font-weight:800;letter-spacing:-.03em}
.dayhead .d2{font-size:13.5px;color:var(--sub);font-weight:600}
.date{font-size:14px;color:var(--sub);margin:0 2px 16px;font-weight:500}
.card{background:var(--card);border-radius:16px;margin:0 0 16px;box-shadow:var(--shadow);overflow:hidden}
.card .inner{padding:15px 16px}
.sec{font-size:14px;font-weight:700;letter-spacing:-.02em;margin:24px 4px 9px;display:flex;align-items:baseline;gap:8px}
.sec .cnt{font-weight:500;color:var(--sub);font-size:12.5px;letter-spacing:0}
.pk{position:relative;padding:14px 16px 14px 19px;cursor:pointer}
.pk+.pk::before{content:"";position:absolute;top:0;left:19px;right:0;height:.5px;background:var(--sep)}
.pk::after{content:"";position:absolute;left:0;top:12px;bottom:12px;width:3.5px;border-radius:0 3px 3px 0;background:var(--gold)}
.pk.miokuri::after{background:var(--sub);opacity:.45}
.pk.kau::after{background:var(--green)}
.pk:active{background:var(--card2)}
.pk .t{display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.pk .t b{font-size:16.5px;font-weight:700;letter-spacing:-.025em}
.pk .m{font-size:13px;color:var(--fg2);opacity:.78;margin-top:4px;line-height:1.55}
.tag{font-size:11px;font-weight:800;border-radius:6px;padding:2px 7px}
.t-kentou{background:var(--accent-l);color:var(--accent2)}
.t-kau{background:var(--green-l);color:var(--green)}
.t-miokuri{background:var(--fill);color:var(--sub)}
.marks{display:flex;gap:6px;flex-wrap:wrap;margin-top:9px}
.mark{display:flex;align-items:center;gap:6px;background:var(--card2);border-radius:9px;
  padding:4px 9px 4px 5px;font-size:12.5px;font-weight:600;border:.5px solid var(--sep)}
.mark .mx{color:var(--sub);font-weight:500;font-size:11.5px}
.cd{flex:0 0 auto;font-size:12.5px;font-weight:700;color:var(--accent2);font-variant-numeric:tabular-nums;
  background:var(--accent-l);border-radius:7px;padding:3px 8px;margin-left:auto}
.cd.soon{background:var(--red-l);color:var(--red)}
.cd.done{background:var(--fill);color:var(--sub)}
.row{display:flex;align-items:center;gap:11px;padding:14px 16px;position:relative;cursor:pointer}
.row+.row::before{content:"";position:absolute;top:0;left:16px;right:0;height:.5px;background:var(--sep)}
.row:active{background:var(--card2)}
.time{flex:0 0 46px;font-size:15.5px;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:-.04em}
.g{flex:1 1 auto;min-width:0}
.g1{font-size:16px;font-weight:700;letter-spacing:-.025em}
.g2{font-size:12.5px;color:var(--sub);margin-top:3px}
.pv{flex:0 0 auto;text-align:right;font-variant-numeric:tabular-nums}
.pv b{display:block;font-size:17px;font-weight:800;letter-spacing:-.04em;color:var(--accent2)}
.pv i{font-style:normal;font-size:11px;color:var(--sub)}
.chev{flex:0 0 auto;color:var(--sub);opacity:.5;font-size:17px;font-weight:700}
.sum{font-size:14px;color:var(--fg2);line-height:1.7}
.sum b{color:var(--fg);font-weight:700;font-variant-numeric:tabular-nums}
.stats{display:flex;gap:9px;margin-top:13px}
.stat{flex:1 1 0;background:var(--card2);border-radius:12px;padding:10px;text-align:center}
.stat .v{font-size:21px;font-weight:800;letter-spacing:-.05em;font-variant-numeric:tabular-nums;color:var(--accent2)}
.stat .k{font-size:11px;color:var(--sub);margin-top:2px}
.seg{display:flex;background:var(--fill);border-radius:11px;padding:2px;gap:2px}
.seg button{flex:1 1 0;border:0;background:transparent;border-radius:9px;padding:9px 4px;font:inherit;
  font-size:13.5px;font-weight:700;color:var(--fg2);letter-spacing:-.02em;cursor:pointer;opacity:.75}
.seg button.on{background:var(--card);color:var(--fg);opacity:1;box-shadow:0 1px 3px rgba(0,0,0,.14)}
[data-theme="dark"] .seg button.on{background:#48484a;box-shadow:none}
.lb{font-size:12.5px;color:var(--sub);font-weight:700;margin:16px 0 8px}
.lb:first-child{margin-top:0}
.res{margin-top:15px;background:linear-gradient(160deg,var(--accent),var(--accent2));border-radius:14px;
  padding:16px 17px;color:#fff}
.res .cap{font-size:12px;font-weight:700;opacity:.85}
.res .big{font-size:22px;font-weight:800;letter-spacing:-.04em;line-height:1.2;margin-top:2px}
.res .sm{font-size:12.5px;margin-top:9px;line-height:1.6;opacity:.92}
.hr{display:flex;align-items:center;gap:10px;padding:12px 16px;position:relative;cursor:pointer}
.hr+.hr::before{content:"";position:absolute;top:0;left:16px;right:0;height:.5px;background:var(--sep)}
.hr:active{background:var(--card2)}
.hr.picked{background:var(--gold-l)}
.num{flex:0 0 auto;width:27px;height:27px;border-radius:8px;display:flex;align-items:center;
  justify-content:center;font-weight:800;font-size:13px;font-variant-numeric:tabular-nums;
  border:1px solid transparent}
.num.s{width:22px;height:22px;font-size:11.5px;border-radius:6px}
.hn{font-size:15.5px;font-weight:700;letter-spacing:-.025em;flex:0 0 auto}
.hm{font-size:12.5px;color:var(--sub);flex:1 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis;
  white-space:nowrap;font-variant-numeric:tabular-nums}
.hsb{flex:0 0 auto;font-size:11.5px;font-weight:800;color:var(--accent2);background:var(--accent-l);
  border-radius:6px;padding:3px 7px;font-variant-numeric:tabular-nums}
.pin{flex:0 0 auto;color:var(--gold);font-size:14px}
.bias{display:flex;gap:9px}
.bias div{flex:1 1 0;background:var(--card2);border-radius:12px;padding:11px 8px;text-align:center}
.bias .v{font-size:18px;font-weight:800;letter-spacing:-.04em;font-variant-numeric:tabular-nums}
.bias .k{font-size:11px;color:var(--sub);line-height:1.4;margin-top:3px}
.pickbtn{width:100%;margin-top:12px;padding:12px;border-radius:12px;border:0;font:inherit;font-size:15px;
  font-weight:800;cursor:pointer;background:var(--gold-l);color:var(--gold)}
.pickbtn.on{background:var(--gold);color:#fff}
details{background:var(--card);border-radius:16px;margin:0 0 10px;overflow:hidden;box-shadow:var(--shadow)}
summary{cursor:pointer;list-style:none;padding:15px 16px;font-size:15px;font-weight:700;
  display:flex;align-items:center;justify-content:space-between;gap:8px}
summary::-webkit-details-marker{display:none}
summary .c{font-weight:500;color:var(--sub);font-size:12.5px;margin-left:auto;margin-right:4px}
summary::after{content:"⌄";color:var(--sub);font-size:18px;font-weight:700;transform:translateY(-3px)}
details[open] summary::after{content:"⌃";transform:translateY(3px)}
.mini{font-size:12.5px;color:var(--sub);padding:0 16px 14px;line-height:1.6}
.mrow{display:flex;align-items:center;gap:9px;padding:10px 16px;position:relative;cursor:pointer}
.mrow+.mrow::before{content:"";position:absolute;top:0;left:16px;right:0;height:.5px;background:var(--sep)}
.mrow .mt{flex:0 0 42px;font-size:12.5px;color:var(--sub);font-variant-numeric:tabular-nums}
.mrow .mg{flex:1 1 auto;min-width:0;font-size:13.5px;font-weight:600;line-height:1.4}
.mrow .sub2{display:block;font-size:11.5px;color:var(--sub);font-weight:500;margin-top:2px}
.mrow .mv{flex:0 0 auto;font-size:12.5px;font-weight:700;font-variant-numeric:tabular-nums}
.mv.down{color:var(--green)} .mv.up{color:var(--red)}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.4);display:none;align-items:flex-end;z-index:60;
  -webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px)}
.modal.on{display:flex}
.sheet{background:var(--card);width:100%;max-width:620px;margin:0 auto;border-radius:22px 22px 0 0;
  padding:10px 18px calc(26px + env(safe-area-inset-bottom,0px));max-height:88vh;overflow:auto;
  animation:up .26s cubic-bezier(.32,.72,0,1)}
@keyframes up{from{transform:translateY(24px)}to{transform:translateY(0)}}
.grab{width:36px;height:5px;border-radius:3px;background:var(--sep);margin:0 auto 14px}
.sheet h3{margin:0;font-size:24px;font-weight:800;letter-spacing:-.04em}
.sheet .sub{color:var(--sub);font-size:13.5px;margin:4px 0 15px;font-variant-numeric:tabular-nums}
.kv{display:grid;grid-template-columns:auto 1fr;font-size:14px;margin:0}
.kv dt{color:var(--sub);padding:10px 0;font-size:13px;border-bottom:.5px solid var(--sep)}
.kv dd{margin:0;padding:10px 0;text-align:right;font-variant-numeric:tabular-nums;font-weight:700;
  border-bottom:.5px solid var(--sep)}
.callout{font-size:12.5px;color:var(--fg2);background:var(--gold-l);border-radius:12px;padding:12px 13px;
  line-height:1.6;margin-top:15px}
.callout b{color:var(--gold)}
.memo{width:100%;border:.5px solid var(--sep);border-radius:12px;padding:11px;font-size:14.5px;
  font-family:inherit;margin-top:14px;background:var(--card2);color:var(--fg);resize:none}
.btns{display:flex;gap:9px;margin-top:16px}
.btns button{flex:1 1 0;padding:14px;border-radius:13px;border:0;font:inherit;font-size:15.5px;
  font-weight:800;cursor:pointer;background:var(--fill);color:var(--fg)}
.btns button.fill{background:var(--accent);color:#fff}
.btns button:active{opacity:.7}
.err{background:var(--card);border-radius:16px;padding:16px;box-shadow:var(--shadow);font-size:14px;line-height:1.7}
.err b{color:var(--red)}
.setup input{width:100%;border:.5px solid var(--sep);border-radius:10px;padding:11px;font-size:15px;
  margin-top:8px;background:var(--card2);color:var(--fg);font-family:inherit}
.hide{display:none}
.load{color:var(--sub);font-size:14px;padding:24px 4px}
</style></head><body>

<header><div class="hrow">
  <div class="brand" id="brand"><span class="silks" id="silks"></span><span class="wm">D.E.R.B.Y.</span></div>
  <button class="back hide" id="backb" onclick="go('home')">
    <svg viewBox="0 0 11 18" fill="none"><path d="M9.5 1L2 9l7.5 8" stroke="currentColor" stroke-width="2.2"
      stroke-linecap="round" stroke-linejoin="round"/></svg>ホーム</button>
  <span class="ttl hide" id="ttl"></span>
  <a class="lab hide" id="labbtn" href="#" target="_blank" rel="noopener">ラボ</a>
  <button class="tgl" id="tgl" onclick="toggleTheme()" aria-label="表示切替">☾</button>
</div></header>

<div class="wrap" id="v-home"><div class="load" id="homeload">読み込み中…</div><div id="homebody"></div></div>
<div class="wrap hide" id="v-race"><div id="racebody"></div></div>
<div class="modal" id="modal" onclick="if(event.target.id==='modal')closeM()"><div class="sheet" id="sheet"></div></div>

<script>
"use strict";
const LS={repo:"kv_repo",token:"kv_token",picks:"derby_picks",theme:"derby_theme"};
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");

function applyTheme(t){document.documentElement.setAttribute("data-theme",t);
  $("tgl").textContent=t==="dark"?"☀":"☾";try{localStorage.setItem(LS.theme,t)}catch(e){}}
function toggleTheme(){applyTheme(document.documentElement.getAttribute("data-theme")==="dark"?"light":"dark");}
(function(){let t=null;try{t=localStorage.getItem(LS.theme)}catch(e){}
  if(!t)t=matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light";applyTheme(t);})();

async function fetchDoc(path){
  try{const r=await fetch("../"+path,{cache:"no-store"});if(r.ok)return await r.text();}catch(e){}
  const repo=localStorage.getItem(LS.repo),token=localStorage.getItem(LS.token);
  if(!repo||!token)throw new Error("NOSETUP");
  const r=await fetch(`https://api.github.com/repos/${repo}/contents/${encodeURI(path)}`,
    {headers:{"Accept":"application/vnd.github.raw+json","Authorization":`Bearer ${token}`,
              "X-GitHub-Api-Version":"2022-11-28"},cache:"no-store"});
  if(r.status===401||r.status===403)throw new Error("トークンが無効か、このリポジトリへの権限がありません");
  if(r.status===404)throw new Error("まだファイルがありません: "+path);
  if(!r.ok)throw new Error("取得失敗 HTTP "+r.status);
  return await r.text();
}
let TODAY=null, IDX=null, PACK=null, PICKS=[];
try{PICKS=JSON.parse(localStorage.getItem(LS.picks)||"[]")}catch(e){PICKS=[]}
const savePicks=()=>{try{localStorage.setItem(LS.picks,JSON.stringify(PICKS))}catch(e){}};

/* 枠色（既存ビューアと同一） */
const WAKU=[null,["#ffffff","#333","#9aa1ab"],["#222222","#fff","#222"],["#e63946","#fff","#e63946"],
  ["#1d6fd6","#fff","#1d6fd6"],["#f6d32d","#333","#e3bd0e"],["#2e9e4f","#fff","#2e9e4f"],
  ["#f28c28","#fff","#f28c28"],["#f4a7c3","#333","#eb8fb2"]];
function waku(num,heads){
  num=+num;heads=+heads;
  if(!num||!heads)return 0;
  if(heads<=8)return num;
  const base=Math.floor(heads/8),rem=heads%8;let cum=0;
  for(let f=1;f<=8;f++){cum+=base+(f>8-rem?1:0);if(num<=cum)return f;}
  return 8;
}
function badge(num,heads,small){
  const [bg,fg,bd]=WAKU[waku(num,heads)]||["var(--fill)","var(--fg)","transparent"];
  return `<span class="num${small?" s":""}" style="background:${bg};color:${fg};border-color:${bd}">${esc(num)}</span>`;
}
$("silks").innerHTML=WAKU.slice(1).map(w=>`<i style="background:${w[0]}"></i>`).join("");

function minsTo(hhmm){
  if(!hhmm)return null;
  const m=String(hhmm).match(/(\d{1,2}):(\d{2})/); if(!m)return null;
  const now=new Date(), t=new Date(now); t.setHours(+m[1],+m[2],0,0);
  return Math.round((t-now)/60000);
}
function cdHtml(hhmm){
  const d=minsTo(hhmm); if(d===null)return "";
  if(d<0)return `<span class="cd done">発走済み</span>`;
  if(d===0)return `<span class="cd soon">まもなく</span>`;
  if(d<60)return `<span class="cd ${d<=15?"soon":""}">あと${d}分</span>`;
  return `<span class="cd">あと${Math.floor(d/60)}時間${d%60?d%60+"分":""}</span>`;
}
const VCODE={"札幌":"01","函館":"02","福島":"03","新潟":"04","東京":"05","中山":"06","中京":"07","京都":"08","阪神":"09","小倉":"10"};
function labUrl(place,date){
  const m=String(place||"").match(/^(\D+)\s*(\d{1,2})/); if(!m)return "";
  const v=VCODE[m[1].trim()], d=String(date||"").replace(/-/g,"");
  if(!v||d.length!==8)return "";
  return `https://www.keibalab.jp/db/race/${d}${v}${String(m[2]).padStart(2,"0")}/`;
}
function timeOf(place){const r=(IDX&&IDX.races||[]).find(x=>x.place===place);return r?r.time:null;}
function headsOf(place){const r=(IDX&&IDX.races||[]).find(x=>x.place===place);return r?r.heads:16;}
function ridOf(place){const r=(IDX&&IDX.races||[]).find(x=>x.place===place);return r?r.race_id:null;}

/* ---------- ホーム ---------- */
function tenkaiLine(){
  const t=TODAY&&TODAY.tenkai; if(!t||!t.courses||!t.courses.length)return "まだ決着した鞍がありません。";
  const done=t.courses.filter(c=>c.fin>0); if(!done.length)return "まだ決着した鞍がありません。";
  const by={};
  done.forEach(c=>{const k=c.ba+c.surf;by[k]=by[k]||{f:0,n:0};by[k].f+=c.front;by[k].n+=c.fin;});
  return Object.keys(by).map(k=>`${k} 前残り <b>${Math.round(by[k].f/by[k].n*100)}%</b>（${by[k].n}鞍）`).join("　/　");
}
/* 場R＋騎手の小さな添え字（馬名の後ろに出す） */
function who(x,extra){
  const bits=[x.place, x.jk, extra].filter(Boolean).map(esc);
  return bits.length?`<span class="sub2">${bits.join("・")}</span>`:"";
}
function mrow(place,time,inner,val,cls){
  const rid=ridOf(place);
  return `<div class="mrow" ${rid?`onclick="openRace('${rid}')"`:""}>
    <span class="mt">${esc(time||"")}</span><span class="mg">${inner}</span>
    ${val?`<span class="mv ${cls||""}">${esc(val)}</span>`:""}</div>`;
}
function drawHome(){
  const nerai=(TODAY.nerai||[]);
  const myomi=nerai.find(n=>/妙味/.test(n.label))||nerai[nerai.length-1];
  const all=(myomi&&myomi.races)||[];
  const up=all.filter(r=>{const m=minsTo(timeOf(r.place));return m===null||m>=-5;});
  const races=up.length?up:all;
  const od=TODAY.odds||{}, al=TODAY.alerts||[], ck=(TODAY.chokyo&&TODAY.chokyo.a)||[], ag=TODAY.agari||[];
  const h=[];
  h.push(`<div class="dayhead"><span class="d1">${esc(TODAY.date)}</span>
    <span class="d2">${esc((TODAY.venues||[]).join("／"))}・${esc(TODAY.races||"")}鞍</span></div>`);
  h.push(`<div class="card"><div class="inner"><div class="sum">${tenkaiLine()}</div>
    <div class="stats">
      <div class="stat"><div class="v">${al.length}</div><div class="k">大穴アラート</div></div>
      <div class="stat"><div class="v">${ck.length}</div><div class="k">調教A</div></div>
      <div class="stat"><div class="v">${races.length}</div><div class="k">妙味の鞍</div></div>
    </div></div></div>`);

  h.push(`<div class="sec">ピック <span class="cnt">${PICKS.length}件</span></div>`);
  h.push(`<div class="card">${PICKS.length?PICKS.map(p=>`
    <div class="pk ${p.state==="見送り"?"miokuri":p.state==="買う"?"kau":""}" onclick="openRace('${esc(p.race_id)}')">
      <div class="t"><b>${esc(p.title)}</b>
        <span class="tag ${p.state==="買う"?"t-kau":p.state==="見送り"?"t-miokuri":"t-kentou"}">${esc(p.state)}</span>
        ${cdHtml(p.time)}</div>
      ${p.memo?`<div class="m">${esc(p.memo)}</div>`:""}
      ${(p.marks||[]).length?`<div class="marks">${p.marks.map(m=>
        `<span class="mark">${badge(m.num,m.heads||16,true)}${esc(m.name)}
         ${m.note?`<span class="mx">${esc(m.note)}</span>`:""}</span>`).join("")}</div>`:""}
    </div>`).join(""):`<div class="inner" style="color:var(--sub);font-size:13.5px">
      鞍ビューの「★ この鞍をピック」か、馬カードの★でここに溜まります。</div>`}</div>`);

  h.push(`<div class="sec">妙味 <span class="cnt">${myomi?esc(myomi.cond):""}</span></div>`);
  h.push(`<div class="card">${races.length?races.map(r=>`
    <div class="row" onclick="openRaceByPlace('${esc(r.place)}')">
      <span class="time">${esc(r.time)}</span>
      <div class="g"><div class="g1">${esc(r.place)} ${esc(r.name)}</div>
        <div class="g2">${esc(r.course)}・${esc(r.heads)}頭／軸 ${esc(r.hs1num)}番（${esc(r.pop)}人）gap${esc(r.gap)}</div></div>
      <span class="pv"><b>${esc(r.value)}倍</b><i>${esc(myomi.vlabel||"")}</i></span><span class="chev">›</span>
    </div>`).join(""):`<div class="inner" style="color:var(--sub);font-size:13.5px">該当なし</div>`}</div>`);

  /* ---- 材料（従来のTODAYの中身） ---- */
  h.push(`<div class="sec">材料</div>`);
  h.push(`<details><summary>オッズの動き<span class="c">支持増${(od.down||[]).length}・支持減${(od.up||[]).length}</span></summary>
    ${(od.down||[]).slice(0,8).map(x=>mrow(x.place,x.time,
      `${badge(x.num,x.heads,true)} ${esc(x.name||"")} ${who(x)}`,`${x.o0}→${x.o1}（${x.pct}%）`,"down")).join("")}
    ${(od.up||[]).slice(0,5).map(x=>mrow(x.place,x.time,
      `${badge(x.num,x.heads,true)} ${esc(x.name||"")} ${who(x)}`,`${x.o0}→${x.o1}（+${Math.abs(x.pct)}%）`,"up")).join("")}
    <div class="mini">オッズが下がった＝支持が増えた。最終4-9番人気で支持が強く増えた馬は複勝1.4-1.6倍（144鞍の実測）。</div>
  </details>`);
  h.push(`<details><summary>大穴アラート<span class="c">${al.length}頭</span></summary>
    ${al.slice(0,14).map(x=>mrow(x.place,x.time,
      `${badge(x.num,x.heads,true)} ${esc(x.name)} ${who(x, x.pop?x.pop+"番人気":"")}`,
      `HS${x.rank}位`)).join("")}
    <div class="mini">HS7位以内 × 8番人気以下。買え指示ではなく、相手を考える材料。</div></details>`);
  h.push(`<details><summary>調教A<span class="c">${ck.length}頭</span></summary>
    ${ck.map(x=>mrow(x.place,x.time,
      `${badge(x.num,x.heads,true)} ${esc(x.name)} ${who(x)}`,
      esc(x.tanpyo||""))).join("")||`<div class="mini">該当なし</div>`}</details>`);
  h.push(`<details><summary>上がり上位<span class="c">${ag.length}頭</span></summary>
    ${ag.slice(0,14).map(x=>mrow(x.place,x.time,
      `${badge(x.num,x.heads,true)} ${esc(x.name)} ${who(x, x.style||"")}`,
      esc(x.val))).join("")}
    <div class="mini">直近5走の最速上がり3F。出所は馬カードに出る。</div></details>`);
  const cs=(TODAY.tenkai&&TODAY.tenkai.courses)||[];
  h.push(`<details><summary>展開（コース別）<span class="c">${cs.length}区分</span></summary>
    ${cs.map(c=>`<div class="mrow"><span class="mt">${esc(c.ba)}</span>
      <span class="mg">${esc(c.label)}</span>
      <span class="mv">平常${Math.round(c.base*100)}%${c.fin?` → 今日${Math.round(c.today*100)}%（${c.fin}鞍）`:""}</span></div>`).join("")}
    <div class="mini">前残り率＝3着以内に逃げ・先行が2頭以上入った割合。平常値は当日を除く全期間。</div></details>`);
  /* 全レース＝軸・騎手・人気・単勝オッズ・床（allracesが無い旧データは鞍一覧で代替） */
  const arace=(TODAY.allraces&&TODAY.allraces.length)?TODAY.allraces:null;
  h.push(`<details><summary>全レース<span class="c">${(arace||(IDX&&IDX.races)||[]).length}鞍</span></summary>
    ${(arace||(IDX&&IDX.races)||[]).map(r=>`<div class="row" onclick="openRaceByPlace('${esc(r.place)}')">
      <span class="time">${esc(r.time)}</span>
      <div class="g"><div class="g1">${esc(r.place)} ${esc(r.name)}</div>
        <div class="g2">${r.hs1num
          ? `軸 ${badge(r.hs1num,r.heads,true)} ${esc(r.hs1name)}${r.jk?`・${esc(r.jk)}`:""}`
          : `${esc(r.course)}・${esc(r.heads)}頭`}</div></div>
      ${r.pop||r.odds!=null
        ? `<span class="pv"><b>${r.pop?esc(r.pop)+"人":""} ${r.odds!=null?esc(r.odds):""}</b>
             <i>床 ${r.floor!=null?esc(r.floor)+"倍":"—"}</i></span>`
        : cdHtml(r.time)}
      <span class="chev">›</span></div>`).join("")}</details>`);
  $("homebody").innerHTML=h.join("");
  $("homeload").classList.add("hide");
}
function openRaceByPlace(place){
  const rid=ridOf(place);
  if(!rid){alert("この鞍のデータがまだありません");return;}
  openRace(rid);
}

/* ---------- 鞍ビュー ---------- */
async function openRace(rid){
  $("racebody").innerHTML=`<div class="load">読み込み中…</div>`;
  go("race");
  try{ PACK=JSON.parse(await fetchDoc(`00_published/p2/${rid}.json`)); }
  catch(e){ $("racebody").innerHTML=`<div class="err"><b>読み込めません</b><br>${esc(e.message)}</div>`; return; }
  drawRace();
}
function pickOf(){ return PACK?PICKS.find(p=>p.race_id===PACK.race_id):null; }
function ensurePick(state){
  let p=pickOf();
  if(!p){p={race_id:PACK.race_id,title:`${PACK.venue}${PACK.r}R ${PACK.race_name}`,
            time:PACK.post_time,heads:PACK.heads,state:state||"検討中",memo:"",marks:[]};PICKS.unshift(p);}
  return p;
}
function drawRace(){
  const place=`${PACK.venue}${PACK.r}`, p=pickOf(), marks=(p&&p.marks)||[];
  const isMk=n=>marks.some(m=>+m.num===+n);
  $("ttl").textContent=`${place}R`;
  const lu=labUrl(place,PACK.date), lb=$("labbtn");
  if(lu){lb.href=lu;lb.classList.remove("hide");}else lb.classList.add("hide");
  const cs=((TODAY&&TODAY.tenkai&&TODAY.tenkai.courses)||[]).find(c=>c.ba===PACK.venue&&PACK.course&&PACK.course.startsWith(c.surf));
  const m=minsTo(PACK.post_time);
  const h=[];
  h.push(`<h1 class="big">${esc(place)}R</h1>
    <div class="date">${esc(PACK.race_name)}・${esc(PACK.post_time)}（${m===null?"":m<0?"発走済み":"あと"+m+"分"}）・${esc(PACK.course)}${esc(PACK.going||"")}・${esc(PACK.heads)}頭</div>`);
  const pc=PACK.pace||{};
  h.push(`<div class="card"><div class="inner"><div class="bias">
    <div><div class="v">逃${pc.nige||0} 先${pc.sen||0}</div><div class="k">差${pc.sashi||0} 追${pc.oi||0}<br>${esc(pc.guess||"")}寄り</div></div>
    <div><div class="v">${cs?Math.round(cs.base*100)+"%":"—"}</div><div class="k">このコースの<br>平常 前残り</div></div>
    <div><div class="v">${cs&&cs.fin?Math.round(cs.today*100)+"%":"—"}</div><div class="k">今日の同条件<br>（${cs?cs.fin:0}鞍）</div></div>
  </div>
  <button class="pickbtn ${p?"on":""}" onclick="togglePick()">${p?"★ ピック中（外す）":"★ この鞍をピック"}</button>
  </div></div>`);
  h.push(`<div class="sec">馬 <span class="cnt">タップで詳細・★で注目</span></div><div class="card">`);
  h.push((PACK.horses||[]).slice().sort((a,b)=>(a.hsr||99)-(b.hsr||99)).map(hh=>`
    <div class="hr ${isMk(hh.num)?"picked":""}" onclick="openM(${hh.num})">
      ${badge(hh.num,PACK.heads)}
      <span class="hn">${esc(hh.name)}</span>
      <span class="hm">${esc(hh.pop)}人 ${esc(hh.odds)} ${esc(hh.kyaku)} 調${esc(hh.oikiri||"-")}</span>
      ${isMk(hh.num)?'<span class="pin">★</span>':""}
      <span class="hsb">HS${esc(hh.hsr)}</span>
    </div>`).join(""));
  h.push(`</div>`);
  h.push(`<div class="sec">買い方</div><div class="card"><div class="inner">
    <div class="lb">絞り込みの深さ</div>
    <div class="seg" id="depth">
      <button class="on" onclick="setK('one',this)">一点勝負</button>
      <button onclick="setK('two',this)">2頭絞り込み</button>
      <button onclick="setK('wide',this)">買い目広め</button>
    </div>
    <div class="res" id="kres"></div>
  </div></div>`);
  h.push(`<div class="sec">この鞍のメモ</div><div class="card"><div class="inner">
    <textarea class="memo" id="rmemo" rows="2" placeholder="なぜ気になるか">${esc(p?p.memo:"")}</textarea>
    <div class="btns">
      <button onclick="setState('検討中')">検討中</button>
      <button onclick="setState('買う')">買う</button>
      <button onclick="setState('見送り')">見送り</button>
    </div></div></div>`);
  $("racebody").innerHTML=h.join("");
  setK("one",document.querySelector("#depth button"));
}
function togglePick(){
  const p=pickOf();
  if(p&&!(p.marks||[]).length&&!p.memo){ PICKS.splice(PICKS.indexOf(p),1); }
  else if(p){ if(!confirm("注目馬とメモも消えます。ピックを外しますか？"))return; PICKS.splice(PICKS.indexOf(p),1); }
  else ensurePick("検討中");
  savePicks(); drawRace(); drawHome();
}
function setState(s){
  const p=ensurePick(s);
  p.state=s; p.memo=($("rmemo")&&$("rmemo").value||"").trim(); p.heads=PACK.heads;
  savePicks(); drawRace(); drawHome();
}
function setK(k,btn){
  document.querySelectorAll("#depth button").forEach(b=>b.classList.remove("on"));
  if(btn)btn.classList.add("on");
  const p=pickOf(), marks=(p&&p.marks)||[];
  const names=marks.length?marks.map(m=>`${m.num}番 ${m.name}`).join(" ／ "):"★で注目した馬がここに並びます";
  const txt={one:["一点勝負","狙いを1点に置く形。3連複1点か単勝。"],
             two:["2頭絞り込み","馬連、または3連複2頭軸。"],
             wide:["買い目広め","3連複のF型・BOX。消去法で構える時。"]}[k];
  $("kres").innerHTML=`<div class="cap">${txt[0]}</div><div class="big">${esc(names)}</div>
    <div class="sm">${txt[1]}</div>`;
}
function openM(num){
  const h=(PACK.horses||[]).find(x=>+x.num===+num); if(!h)return;
  const p=pickOf(), mk=(p&&p.marks||[]).find(m=>+m.num===+num);
  $("sheet").innerHTML=`<div class="grab"></div>
    <h3>${esc(h.name)}</h3>
    <div class="sub">${esc(h.num)}番・${esc(h.pop)}番人気 ${esc(h.odds)}倍／HS${esc(h.hsr)}位 ${esc(h.hs)}／${esc(h.jk)}・${esc(h.tr)}</div>
    <dl class="kv">
      <dt>脚質</dt><dd>${esc(h.kyaku)}</dd>
      <dt>調教</dt><dd>${esc(h.oikiri||"-")}</dd>
      <dt>上がり</dt><dd>${esc(h.agari_cell||"-")}</dd>
      <dt>コース複勝</dt><dd>${esc(h.kofuku||"-")}</dd>
      <dt>距離帯複勝</dt><dd>${esc(h.kyofuku||"-")}</dd>
      <dt>持ち時計</dt><dd>${esc(h.jitai||"-")}</dd>
      <dt>前走</dt><dd>${esc(h.zenso||"-")}</dd>
      <dt>斤量・馬体重</dt><dd>${esc(h.kin)}／${esc(h.bataiju||"-")}</dd>
      <dt>オッズ</dt><dd>${esc(h.odds_cell||h.odds)}</dd>
    </dl>
    ${(h.hsr>=8&&h.hsr<=10&&/逃|先/.test(h.kyaku))?`<div class="callout">
      <b>HS8-10位 × 前で運ぶ脚質</b>　3着へ飛び込む率が逃げ1.5倍・先行1.4倍（全4841鞍）。
      機械の相手網（HS2-7位）には入らない位置。</div>`:""}
    <textarea class="memo" id="hmemo" rows="2" placeholder="なぜ気になるか">${esc(mk?mk.note:"")}</textarea>
    <div class="btns">
      <button onclick="closeM()">閉じる</button>
      <button class="fill" onclick="mark(${h.num})">${mk?"★ 注目を外す":"★ この鞍に注目を追加"}</button>
    </div>`;
  $("modal").classList.add("on");
}
function mark(num){
  const h=(PACK.horses||[]).find(x=>+x.num===+num);
  const p=ensurePick("検討中");
  const i=p.marks.findIndex(m=>+m.num===+num);
  const note=($("hmemo")&&$("hmemo").value||"").trim();
  if(i>=0)p.marks.splice(i,1);
  else p.marks.push({num:h.num,name:h.name,heads:PACK.heads,note:note||`HS${h.hsr}位・${h.pop}人気`});
  savePicks(); closeM(); drawRace(); drawHome();
}
function closeM(){$("modal").classList.remove("on");}
function go(v){
  const home=v==="home";
  $("v-home").classList.toggle("hide",!home);
  $("v-race").classList.toggle("hide",home);
  $("brand").classList.toggle("hide",!home);
  $("backb").classList.toggle("hide",home);
  $("ttl").classList.toggle("hide",home);
  if(home)$("labbtn").classList.add("hide");
  window.scrollTo(0,0);
}
(async()=>{
  try{
    TODAY=JSON.parse(await fetchDoc("00_published/TODAY.json"));
    try{IDX=JSON.parse(await fetchDoc("00_published/p2/index.json"));}catch(e){IDX={races:[]};}
    drawHome();
  }catch(e){
    $("homeload").classList.add("hide");
    $("homebody").innerHTML = e.message==="NOSETUP"
      ? `<div class="err setup"><b>初回設定</b><br>リポジトリとトークンを保存してください。
          <input id="repo" placeholder="hir019inc/keiba-yosou">
          <input id="token" type="password" placeholder="GitHub トークン">
          <div class="btns"><button class="fill" onclick="saveSetup()">保存して読み込む</button></div></div>`
      : `<div class="err"><b>読み込めません</b><br>${esc(e.message)}</div>`;
  }
})();
function saveSetup(){
  try{localStorage.setItem(LS.repo,$("repo").value.trim());
      localStorage.setItem(LS.token,$("token").value.trim());}catch(e){}
  location.reload();
}
setInterval(()=>{ if(!$("v-home").classList.contains("hide")&&TODAY) drawHome(); }, 60000);
</script>
</body></html>
